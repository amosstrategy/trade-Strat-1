<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Daily Energy Map</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0d1117;
      --bg-soft: #151b25;
      --bg-card: #1b2330;
      --line: #2d3748;
      --text: #edf2f7;
      --muted: #a7b1c2;
      --accent: #84dcc6;
      --accent-2: #f6c177;
      --good: #71e39b;
      --warn: #ffd166;
      --low: #ff7a7a;
      --defined: #d7a4ff;
      --transit: #84dcc6;
      --both: #f6c177;
      --cyber-cyan: #00f5ff;
      --cyber-magenta: #ff2aab;
      --cyber-lime: #c8ff57;
      --cyber-violet: #b44dff;
      --shadow: 0 24px 80px rgba(0,0,0,.32);
      --radius: 22px;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at 20% 0%, rgba(132,220,198,.16), transparent 34rem),
        radial-gradient(circle at 90% 10%, rgba(246,193,119,.12), transparent 36rem),
        var(--bg);
      color: var(--text);
    }

    button, select, input, textarea {
      font: inherit;
      color: inherit;
    }

    button, select {
      border: 1px solid var(--line);
      background: var(--bg-card);
      color: var(--text);
      border-radius: 999px;
      padding: .72rem 1rem;
      cursor: pointer;
      transition: border-color .2s, background .2s, transform .2s;
    }

    select option {
      background: var(--bg-card);
      color: var(--text);
    }

    input[type="date"],
    input[type="time"],
    input[type="text"],
    textarea {
      border: 1px solid var(--line);
      background: var(--bg-card);
      color: var(--text);
      border-radius: 14px;
      padding: .72rem .95rem;
      width: 100%;
    }

    input[type="date"]::-webkit-calendar-picker-indicator,
    input[type="time"]::-webkit-calendar-picker-indicator {
      filter: invert(0.88);
      cursor: pointer;
    }

    .field label {
      display: block;
      font-size: .78rem;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 6px;
    }

    .field { margin-bottom: 14px; }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 12px;
    }

    .tab-btn {
      border-radius: 999px;
      padding: .7rem 1.15rem;
      font-weight: 600;
      letter-spacing: .04em;
    }

    .tab-btn.active {
      border-color: var(--accent);
      background: rgba(132,220,198,.16);
      color: var(--text);
      box-shadow: 0 0 0 1px rgba(132,220,198,.25);
    }

    .date-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      align-items: center;
      justify-content: space-between;
      padding: 16px 18px;
      margin-bottom: 18px;
      border: 1px solid rgba(132,220,198,.22);
      border-radius: 18px;
      background: linear-gradient(135deg, rgba(132,220,198,.12), rgba(255,255,255,.03));
    }

    .date-display strong {
      display: block;
      font-size: clamp(1.15rem, 2.2vw, 1.55rem);
      letter-spacing: -.02em;
      margin-top: 4px;
    }

    .date-label {
      font-size: .72rem;
      letter-spacing: .14em;
      text-transform: uppercase;
      color: var(--accent);
      font-weight: 700;
    }

    .date-relative {
      display: inline-block;
      margin-top: 6px;
      padding: .2rem .55rem;
      border-radius: 999px;
      background: rgba(246,193,119,.16);
      color: var(--accent-2);
      font-size: .82rem;
      font-weight: 600;
    }

    .date-controls {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }

    .date-controls input[type="date"] {
      width: auto;
      min-width: 11.5rem;
      font-weight: 600;
    }

    .profile-select {
      width: 100%;
      border-radius: 14px;
      padding: .8rem 1rem;
      font-weight: 600;
    }

    .tab-panel { display: block; }
    .tab-panel.hidden { display: none; }

    .reading-cards {
      display: grid;
      gap: 12px;
      margin-bottom: 18px;
    }

    .reading-card {
      padding: 14px 16px 14px 18px;
      border-radius: 14px;
      background: rgba(255,255,255,.04);
      border: 1px solid rgba(255,255,255,.08);
      border-left: 4px solid var(--card-accent, var(--accent));
    }

    .reading-card.theme { --card-accent: #f6a623; }
    .reading-card.practical { --card-accent: #71e39b; }
    .reading-card.warning { --card-accent: #ff9f43; }
    .reading-card.moon { --card-accent: #8fa4c4; }
    .reading-card.channel { --card-accent: #d7a4ff; }
    .reading-card.transit { --card-accent: #5bdcb8; }
    .reading-card.transit-hit { --card-accent: #d7a4ff; }
    .reading-card.transit-open { --card-accent: #ff9f43; }

    .reading-card-head {
      font-size: .72rem;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: var(--card-accent);
      margin-bottom: 8px;
      font-weight: 700;
    }

    .reading-card-meta {
      font-size: .82rem;
      color: var(--muted);
      margin-bottom: 6px;
    }

    .reading-card-body {
      line-height: 1.5;
      color: var(--text);
    }

    .reading-card-q {
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid rgba(255,255,255,.08);
      color: var(--muted);
      font-size: .88rem;
      line-height: 1.45;
    }

    .reading-accordion {
      padding: 0;
      overflow: hidden;
    }

    .reading-accordion > summary {
      list-style: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 12px 14px 12px 16px;
      user-select: none;
    }

    .reading-accordion > summary::-webkit-details-marker { display: none; }

    .acc-head {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
      flex: 1;
    }

    .acc-icon {
      font-size: 1.15rem;
      line-height: 1;
      flex-shrink: 0;
    }

    .acc-field {
      font-size: .95rem;
      font-weight: 600;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .acc-tag {
      font-size: .72rem;
      letter-spacing: .06em;
      color: var(--muted);
      flex-shrink: 0;
    }

    .acc-chevron {
      color: var(--muted);
      font-size: .65rem;
      transition: transform .18s ease;
      flex-shrink: 0;
    }

    .reading-accordion[open] > summary .acc-chevron { transform: rotate(180deg); }

    .reading-accordion-body {
      padding: 0 16px 14px 16px;
      border-top: 1px solid rgba(255,255,255,.06);
    }

    .reading-accordion-body .reading-card-body {
      margin-top: 12px;
      font-size: .92rem;
    }

    .reading-group > summary {
      font-size: .98rem;
    }

    .reading-group > summary .acc-field {
      font-size: 1rem;
      letter-spacing: .02em;
    }

    .reading-group-body {
      display: grid;
      gap: 8px;
      padding: 8px 12px 12px;
      border-top: 1px solid rgba(255,255,255,.06);
    }

    .reading-group .reading-accordion {
      border-left-width: 3px;
      background: rgba(0,0,0,.14);
    }

    .reading-group .reading-accordion > summary {
      padding: 10px 12px;
    }

    .reading-group .reading-accordion .acc-field {
      font-size: .88rem;
      font-weight: 500;
    }

    .reading-subgroup {
      border-left-width: 3px;
      background: rgba(0,0,0,.1);
    }

    .reading-subgroup > summary {
      padding: 10px 12px;
    }

    .reading-subgroup > summary .acc-field {
      font-size: .9rem;
      font-weight: 600;
    }

    .reading-subgroup-body {
      display: grid;
      gap: 6px;
      padding: 6px 8px 10px;
      border-top: 1px solid rgba(255,255,255,.05);
    }

    .reading-subgroup .reading-accordion > summary .acc-field {
      font-size: .86rem;
      font-weight: 500;
      color: var(--text);
    }

    .acc-astro {
      margin-top: 10px;
      padding-top: 8px;
      border-top: 1px solid rgba(255,255,255,.06);
      font-size: .72rem;
      letter-spacing: .04em;
      color: var(--muted);
      opacity: .85;
    }

    .computed-badge {
      display: inline-block;
      margin-top: 8px;
      padding: .25rem .55rem;
      border-radius: 999px;
      background: rgba(132,220,198,.14);
      color: var(--accent);
      font-size: .75rem;
      font-weight: 600;
    }

    button:hover, select:hover {
      border-color: var(--accent);
      background: rgba(132,220,198,.08);
      transform: translateY(-1px);
    }

    .app {
      width: min(1440px, calc(100% - 32px));
      margin: 0 auto;
      padding: 14px 0 48px;
    }

    .hero {
      display: grid;
      grid-template-columns: 1fr;
      gap: 22px;
      align-items: stretch;
      margin-bottom: 22px;
    }

    .hero.compact-top {
      margin-bottom: 10px;
      gap: 0;
    }

    .panel, .hero-card {
      border: 1px solid rgba(255,255,255,.08);
      background: linear-gradient(180deg, rgba(255,255,255,.055), rgba(255,255,255,.025));
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }

    .hero-card {
      padding: 30px;
      min-height: 310px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .hero-card.compact-top-card {
      padding: 10px 14px;
      min-height: 0;
      gap: 0;
    }

    .hero-card.compact-top-card .hero-top-row {
      text-align: center;
    }

    .hero-card.compact-top-card .hero-copy {
      max-width: 100%;
      margin: 0 auto;
      width: 100%;
    }

    .hero-card.compact-top-card h1 {
      font-size: clamp(1.35rem, 2.9vw + 0.55rem, 2.85rem);
      line-height: 1.08;
      letter-spacing: -.045em;
      margin: 1px 0 3px;
      text-wrap: balance;
    }

    .hero-card.compact-top-card .lead {
      font-size: .76rem;
      line-height: 1.35;
      margin: 0;
      max-width: none;
    }

    .hero-card.compact-top-card .eyebrow {
      font-size: .6rem;
      letter-spacing: .12em;
    }

    .hero-card.compact-top-card .toolbar {
      margin-top: 0;
      flex-shrink: 0;
      justify-content: center;
    }

    .hero-card.compact-top-card .toolbar button {
      padding: .4rem .75rem;
      font-size: .78rem;
    }

    .date-bar.compact-top {
      padding: 8px 12px;
      margin-bottom: 10px;
      gap: 8px;
      border-radius: 14px;
    }

    .date-bar.compact-top .date-display strong {
      font-size: .92rem;
      margin-top: 0;
    }

    .date-bar.compact-top .date-line {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 2px;
    }

    .date-bar.compact-top .date-label {
      font-size: .6rem;
    }

    .date-bar.compact-top .date-relative {
      margin-top: 0;
      font-size: .72rem;
      padding: .12rem .45rem;
    }

    .date-bar.compact-top .date-controls button,
    .date-bar.compact-top .date-controls input[type="date"] {
      padding: .38rem .65rem;
      font-size: .78rem;
    }

    .date-bar.compact-top .date-controls input[type="date"] {
      min-width: 9rem;
    }

    .profile-strip.compact-top {
      padding: 10px 12px;
    }

    .profile-strip.compact-top .profile-card {
      gap: 6px;
    }

    .profile-strip.compact-top .field {
      margin-bottom: 0;
    }

    .profile-strip.compact-top .field label {
      font-size: .62rem;
      margin-bottom: 3px;
    }

    .profile-strip.compact-top .profile-select {
      padding: .42rem .65rem;
      font-size: .82rem;
    }

    .profile-strip.compact-top .form-grid {
      gap: 8px;
    }

    .profile-strip.compact-top .small-card {
      padding: 8px 10px;
      margin-bottom: 0;
      font-size: .78rem;
      line-height: 1.4;
      border-radius: 12px;
    }

    .profile-strip.compact-top .tag-row {
      gap: 5px;
    }

    .profile-strip.compact-top .tag {
      padding: .22rem .5rem;
      font-size: .72rem;
    }

    @media (min-width: 960px) {
      .profile-strip.compact-top .profile-card {
        display: flex;
        flex-wrap: wrap;
        align-items: flex-start;
        gap: 8px 14px;
      }

      .profile-strip.compact-top .form-grid {
        flex: 0 1 340px;
        min-width: 260px;
      }

      .profile-strip.compact-top .profile-summary {
        flex: 1 1 280px;
        margin-top: 0;
      }

      .profile-strip.compact-top .tag-row {
        flex: 1 1 100%;
      }
    }

    @media (min-width: 960px) {
      .map-sidebar-col .profile-strip.compact-top .profile-card {
        display: grid;
      }

      .map-sidebar-col .profile-strip.compact-top .form-grid,
      .map-sidebar-col .profile-strip.compact-top .profile-summary,
      .map-sidebar-col .profile-strip.compact-top .tag-row {
        flex: none;
        min-width: 0;
      }
    }

    .eyebrow {
      color: var(--accent);
      letter-spacing: .18em;
      text-transform: uppercase;
      font-size: .78rem;
      font-weight: 700;
    }

    h1, h2, h3, p { margin-top: 0; }
    h1 {
      font-size: clamp(2.35rem, 5vw, 5rem);
      line-height: .92;
      letter-spacing: -.06em;
      margin-bottom: 1.1rem;
    }

    .lead {
      color: var(--muted);
      font-size: clamp(1.05rem, 1.8vw, 1.35rem);
      max-width: 62rem;
      line-height: 1.55;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      margin-top: 24px;
    }

    .toolbar button.active {
      border-color: var(--accent);
      background: rgba(132, 220, 198, .14);
      color: var(--accent);
    }

    .score-card {
      padding: 26px;
      display: grid;
      gap: 18px;
    }

    .score-ring {
      width: 190px;
      height: 190px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      margin: 0 auto;
      background: conic-gradient(var(--ring) calc(var(--score) * 10%), rgba(255,255,255,.07) 0);
      position: relative;
    }

    .score-ring::before {
      content: "";
      position: absolute;
      inset: 15px;
      border-radius: inherit;
      background: var(--bg-soft);
    }

    .score-ring strong {
      position: relative;
      font-size: 3.6rem;
      letter-spacing: -.08em;
    }

    .score-ring span {
      position: relative;
      color: var(--muted);
      align-self: end;
    }

    .date-line {
      color: var(--muted);
      text-align: center;
      margin-bottom: 0;
    }

    .grid {
      display: grid;
      grid-template-columns: minmax(320px, .88fr) minmax(420px, 1.35fr) minmax(320px, .92fr);
      gap: 18px;
      align-items: start;
    }

    .panel {
      padding: 20px;
      overflow: hidden;
    }

    .panel.bodygraph-wrap {
      overflow: visible;
    }

    .panel h2 {
      font-size: 1rem;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 14px;
    }

    .profile-card {
      display: grid;
      gap: 12px;
      margin-bottom: 18px;
    }

    .tag-row, .metric-row, .planet-grid, .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .tag, .chip, .metric {
      border: 1px solid rgba(255,255,255,.08);
      background: rgba(255,255,255,.045);
      border-radius: 999px;
      padding: .45rem .72rem;
      color: var(--muted);
      font-size: .88rem;
    }

    .tag strong, .metric strong { color: var(--text); }
    .metric { display: inline-flex; gap: 7px; align-items: center; }

    .reading {
      background: rgba(132,220,198,.08);
      border: 1px solid rgba(132,220,198,.2);
      border-radius: 18px;
      padding: 16px;
      line-height: 1.55;
      color: #dceee9;
      margin-bottom: 16px;
    }

    .dimension {
      display: grid;
      gap: 6px;
      margin: 11px 0;
    }

    .dimension-head {
      display: flex;
      justify-content: space-between;
      color: var(--muted);
      font-size: .92rem;
    }

    .bar {
      height: 10px;
      border-radius: 999px;
      background: rgba(255,255,255,.07);
      overflow: hidden;
    }

    .bar > i {
      display: block;
      height: 100%;
      width: calc(var(--value) * 10%);
      background: linear-gradient(90deg, var(--ring), var(--accent));
      border-radius: inherit;
    }

    .map-grid {
      display: grid;
      grid-template-columns: minmax(220px, .62fr) minmax(340px, 1.05fr) minmax(360px, 1.15fr);
      gap: 18px;
      align-items: start;
    }

    .day-overview-panel {
      padding: 12px 14px;
      margin-bottom: 10px;
    }

    .day-overview-strip {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      align-items: stretch;
    }

    .day-overview-strip--single {
      grid-template-columns: 1fr;
    }

    .day-overview-strip .focus-overview {
      margin-bottom: 0;
      height: 100%;
      display: flex;
      flex-direction: column;
      min-height: 7.25rem;
    }

    .day-overview-strip .focus-overview-head {
      padding: 12px 14px 10px;
      text-align: center;
      flex-shrink: 0;
    }

    .day-overview-strip .focus-overview-head .acc-head {
      justify-content: center;
      flex-wrap: wrap;
      gap: 6px 10px;
    }

    .day-overview-strip .focus-overview .acc-field {
      font-size: clamp(1.05rem, 0.9vw + 0.82rem, 1.28rem);
      font-weight: 700;
      letter-spacing: -.01em;
    }

    .day-overview-strip .focus-mantra .acc-tag {
      font-size: clamp(.72rem, 0.45vw + 0.62rem, .84rem);
      color: var(--accent);
    }

    .day-overview-strip .focus-overview .acc-icon {
      font-size: clamp(1.1rem, 0.7vw + 0.9rem, 1.32rem);
    }

    .day-overview-strip .focus-overview-body {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 8px 16px 14px;
      text-align: center;
      border-top: none;
    }

    .day-overview-strip .focus-overview-body .reading-card-body {
      margin-top: 0;
      font-size: clamp(.9rem, 0.55vw + 0.82rem, 1.05rem);
      line-height: 1.52;
      text-align: center;
      font-weight: 500;
    }

    .day-overview-strip .daily-mantra-text {
      margin-top: 0;
      font-size: clamp(.92rem, 0.6vw + 0.84rem, 1.08rem);
      line-height: 1.52;
      text-align: center;
      font-weight: 500;
    }

    .day-overview-strip .focus-mantra.focus-overview,
    .day-overview-strip .focus-global-warn.focus-overview {
      box-shadow:
        0 0 0 1px rgba(132, 220, 198, .12),
        0 0 14px rgba(132, 220, 198, .14);
    }

    .day-overview-strip .focus-global-warn.focus-overview {
      box-shadow:
        0 0 0 1px rgba(255, 209, 102, .12),
        0 0 14px rgba(255, 209, 102, .14);
    }

    @media (max-width: 1120px) {
      .day-overview-strip {
        grid-template-columns: 1fr;
        max-width: none;
      }
    }

    .map-sidebar-col {
      display: grid;
      gap: 10px;
      align-content: start;
      position: sticky;
      top: 12px;
      min-width: 0;
    }

    .map-sidebar-col .profile-strip.compact-top {
      margin-bottom: 0;
    }

    .map-sidebar-col .profile-strip.compact-top .profile-card {
      display: grid;
      gap: 6px;
    }

    .map-sidebar-col .profile-strip.compact-top .form-grid {
      grid-template-columns: 1fr;
    }

    .map-sidebar-col .score-sidebar {
      position: static;
      top: auto;
    }

    .score-sidebar {
      display: grid;
      gap: 14px;
      position: sticky;
      top: 12px;
    }

    .score-sidebar .score-ring {
      width: 150px;
      height: 150px;
    }

    .score-sidebar .score-ring strong {
      font-size: 2.8rem;
    }

    .score-caption {
      text-align: center;
      color: var(--muted);
      font-size: .88rem;
      line-height: 1.45;
      margin: 0;
    }

    .dimension-list {
      display: grid;
      gap: 8px;
    }

    .dimension-select {
      display: grid;
      grid-template-columns: auto 1fr auto;
      grid-template-rows: auto auto;
      gap: 4px 10px;
      align-items: center;
      width: 100%;
      padding: 10px 12px;
      border-radius: 14px;
      border: 1px solid rgba(255,255,255,.08);
      background: rgba(255,255,255,.04);
      color: var(--text);
      cursor: pointer;
      text-align: left;
      font: inherit;
      transition: border-color .15s, background .15s;
    }

    .dimension-select:hover {
      border-color: rgba(132,220,198,.35);
      background: rgba(132,220,198,.06);
    }

    .dimension-select.active {

      return { chartGate, transitGate };

      const openCenter = fromOpen ? ch.from : toOpen ? ch.to : null;

      if (!effect) {

          `G${chartGate} + transit G${transitGate}: ${T(CENTER_LABELS[ch.from])} ↔ ${T(CENTER_LABELS[ch.to])}.`
        );
      }

      if (ch.completedByTransit && openCenter) {

          `G${chartGate} + Transit G${transitGate}: ${effect.de}`,

  let chartSvgTemplate = null;

  function hydrateBodygraph(svgRoot, day) {
    let style = svgRoot.querySelector("style#hd-hydration");
    if (!style) {
      style = document.createElementNS("http://www.w3.org/2000/svg", "style");
      style.id = "hd-hydration";
      svgRoot.appendChild(style);
    }
    style.textContent = HDLogic.buildHydrationCSS(
      day.chart,
      day.transit,
      day.showTransits,
      BODYGRAPH_CHANNELS,
      CENTER_SVG_ID
    );
  }

  function ensureChartTemplate() {
    if (!chartSvgTemplate) chartSvgTemplate = CHART_SVG;
    return chartSvgTemplate;
  }

  function mountBodygraph(day) {
    const host = document.getElementById("bodygraphHost");
    if (!host) return;
    if (!day.profile.chartComputed) {
      host.innerHTML = `<div class="small-card warning">${T(BL("Bodygraph wird angezeigt, sobald Geburtsdaten gespeichert sind.", "Bodygraph appears once birth data is saved."))}</div>`;
      return;
    }
    try {
      host.innerHTML = ensureChartTemplate();
      const svg = host.querySelector("svg");
      if (svg) {
        svg.classList.add("bodygraph-svg");
        svg.setAttribute("viewBox", "-48 -32 948 1374");
        svg.setAttribute("preserveAspectRatio", "xMidYMid meet");
        svg.setAttribute("role", "img");
        svg.setAttribute("aria-label", day.showTransits ? "Bodygraph with transits" : "Bodygraph");
        hydrateBodygraph(svg, day);
        bindBodygraphEvents(day, host);
      }
    } catch {
      host.innerHTML = `<div class="small-card">${T(BL("Bodygraph konnte nicht geladen werden.", "Bodygraph could not be loaded."))}</div>`;
    }
  }

  function gateFromEventTarget(node) {
    while (node && node.id !== "chart") {
      const id = node.id || "";
      const m = id.match(/^Gate(\d+)-(a|b|outline)$/);
      if (m) return Number(m[1]);
      node = node.parentNode;
    }
    return null;
  }

  function centerFromEventTarget(node) {
    while (node && node.id !== "chart") {
      const hit = Object.entries(CENTER_SVG_ID).find(([, svgId]) => node.id === svgId);
      if (hit) return hit[0];
      node = node.parentNode;
    }
    return null;
  }

  function centerNoteForProfile(profile, center) {
    const defined = profile.definedCenters.includes(center);
    if (profile.chartComputed) {
      return defined ? CENTER_DESCRIPTIONS[center] : OPEN_CENTER_WARNINGS[center];
    }
    return CENTER_DESCRIPTIONS[center];
  }

  function bindBodygraphEvents(day, host) {
    const profile = day.profile;
    const model = day.display;
    host.querySelectorAll("[id^='Gate']").forEach(node => {

        const gate = gateFromEventTarget(event.target);
        if (gate) document.getElementById("detailBox").innerHTML = detailForGate(profile, day, gate);
      });
    });
    Object.values(CENTER_SVG_ID).forEach(svgId => {
      const centerNode = host.querySelector(`[id="${svgId}"]`);
      if (!centerNode) return;
      centerNode.addEventListener("click", () => {
        const center = Object.entries(CENTER_SVG_ID).find(([, id]) => id === svgId)[0];
        const defined = profile.definedCenters.includes(center);
        const profileNote = centerNoteForProfile(profile, center);
        document.getElementById("detailBox").innerHTML = `<strong>${T(CENTER_LABELS[center])}</strong><br>${T(profileNote)}<br><span>${defined ? T(BL("In deinem Chart definiert.", "Defined in your chart.")) : T(BL("In deinem Chart offen.", "Open in your chart."))}</span>`;
      });
    });

    function computeTransitScores(profile, transit) {
      const chartLayer = HDLogic.buildChartLayer(profile, CHANNELS);
      const baseline = computeChartScores(profile, chartLayer);
      const values = { ...baseline.values };
      const personal = new Set(profile.definedGates);
      const transitGates = transit.gateSet;
      const activatedChannels = transit.activatedChannels;

      transit.transits.forEach(t => {
        const dim = GATE_INFO[t.gate].dimension;
        values[dim] += personal.has(t.gate) ? 0.35 : 0.5;
        if (!profile.definedCenters.includes(t.center)) values.clarity -= 0.08;
      });

      activatedChannels.forEach(channel => {
        if (channel.completedByTransit) {
          const dimA = GATE_INFO[channel.a].dimension;
          const dimB = GATE_INFO[channel.b].dimension;
          values[dimA] += 0.45;
          values[dimB] += 0.35;
        }
      });

      if (transitGates.has(14) || transitGates.has(45) || transitGates.has(26)) values.energy += 0.25;
      if (transitGates.has(57) || transitGates.has(48)) values.intuition += 0.25;
      if (transitGates.has(12) || transitGates.has(23) || transitGates.has(62)) values.expression += 0.2;
      if (transitGates.has(5) || transitGates.has(15) || transitGates.has(46)) values.flow += 0.2;

      Object.keys(values).forEach(dim => values[dim] = +clamp(values[dim]).toFixed(1));
      const weighted = Object.entries(values).reduce((sum, [dim, value]) => sum + value * DIMENSIONS[dim].weight, 0);
      const weight = Object.values(DIMENSIONS).reduce((sum, dim) => sum + dim.weight, 0);
      const overall = +clamp(weighted / weight).toFixed(1);
      const abundance = (values.energy >= 7.2 && values.flow >= 6.2) || [14, 45, 26, 44, 21].some(g => transitGates.has(g) && personal.has(g));
      return { values, overall, abundance };
    }

    function computeChartScores(profile, chart) {
      const values = Object.fromEntries(Object.keys(DIMENSIONS).map(dim => [dim, 5.0]));
      chart.allGates.forEach(gate => {
        values[GATE_INFO[gate].dimension] += 0.28;
      });
      chart.nativeChannels.forEach(ch => {
        values[GATE_INFO[ch.a].dimension] += 0.55;
        values[GATE_INFO[ch.b].dimension] += 0.4;
      });
      Object.keys(values).forEach(dim => values[dim] = +clamp(values[dim]).toFixed(1));
      const weighted = Object.entries(values).reduce((sum, [dim, value]) => sum + value * DIMENSIONS[dim].weight, 0);
      const weight = Object.values(DIMENSIONS).reduce((sum, dim) => sum + dim.weight, 0);
      const overall = +clamp(weighted / weight).toFixed(1);
      const abundance = [14, 45, 26, 44, 21].some(g => chart.gateSet.has(g));
      return { values, overall, abundance };
    }

    function buildModel(profile, date, withTransits) {
      const transits = transitsFor(date);
      const day = HDLogic.buildDayModel(profile, transits, CHANNELS, withTransits, {
        full: computeTransitScores,
        chart: computeChartScores
      });
      day.profile = profile;
      return day;
    }

    function borrowedDefinitionCenters(items) {

    function borrowedDefinitionFieldLabel(items) {

    function renderCollapsedBorrowedDefinition(items, profile, model) {

    function renderCollapsedOpenConditioning(items, profile, model, expanded = false) {
      const byCenter = {};

        if (!byCenter[c]) byCenter[c] = [];
        byCenter[c].push(e);
      });
      return Object.entries(byCenter).map(([center, group]) => {
        if (group.length === 1) return renderTransitEntryCard(group[0], profile, model, expanded);
        const centerLabel = T(CENTER_LABELS[center]);
        const body = BL(
          `${group.length} Transite aktivieren dein offenes ${centerLabel}. ${NOT_SELF_QUESTIONS[center].de}`,
          `${group.length} transits activate your open ${centerLabel}. ${NOT_SELF_QUESTIONS[center].en}`
        );
        const refs = group.map(e => transitAstroLine(e.transit)).join("<br>");
        return impactContentBlock(body, `<div class="acc-astro-stack">${refs}</div>`, null);
      }).join("");

    function renderImpactEntries(impactKey, items, profile, model, expanded = false) {
      if (!items.length) return "";
      if (impactKey === "borrowedDefinition") {
        return renderCollapsedBorrowedDefinition(items, profile, model);
      }
      if (impactKey === "openConditioning" && items.length >= 2) {
        return renderCollapsedOpenConditioning(items, profile, model, expanded);
      }
      return items.map(e => e.channel
        ? renderChannelEntryCard(e, profile, expanded)
        : renderTransitEntryCard(e, profile, model, expanded)
      ).join("");

      const fieldLabel = impactKey === "borrowedDefinition"

      const countLabel = impactKey === "borrowedDefinition" ? "" : String(items.length);
      const bodyHtml = renderImpactEntries(impactKey, items, profile, model, expanded);
      return `
        <details class="reading-card reading-accordion reading-subgroup ${meta.kind}"${expanded ? " open" : ""}>

    function dimensionGroup(dimKey, entries, profile, model) {
      const dim = DIMENSIONS[dimKey];

      entries.forEach(e => {

        byImpact[e.impactKey].push(e);
      });
      const subgroups = IMPACT_ORDER
        .filter(k => byImpact[k]?.length)
        .map(k => impactSubgroup(k, byImpact[k], profile, model));
      const kind = groupAccentKind(entries);
      const countLabel = T(BL(
        `${entries.length} ${entries.length === 1 ? "Eintrag" : "Eintraege"}`,
        `${entries.length} ${entries.length === 1 ? "entry" : "entries"}`

      return `

          <summary>
            <span class="acc-head">
              <span class="acc-icon">${dim.icon}</span>

              <span class="acc-tag">${countLabel}</span>

            <span class="acc-chevron">▼</span>
          </summary>
          <div class="reading-group-body">${subgroups.join("")}</div>
        </details>`;
    }

    function collectTransitEntries(profile, model, excludeIds = null) {
      const buckets = Object.fromEntries(DIMENSION_ORDER.map(k => [k, []]));
      const skip = excludeIds || new Set();

      const sorted = [...model.transits].sort((a, b) => {
        const ai = TRANSIT_PRIORITY.indexOf(a.id);
        const bi = TRANSIT_PRIORITY.indexOf(b.id);
        return (ai === -1 ? 99 : ai) - (bi === -1 ? 99 : bi);
      });

      sorted.forEach(t => {
        if (skip.has(t.id)) return;
        const dimKey = GATE_INFO[t.gate].dimension;
        if (!buckets[dimKey]) buckets[dimKey] = [];
        const impactKey = transitImpact(profile, t, model);
        buckets[dimKey].push({
          impactKey,
          kind: transitCardKind(profile, t, model),
          transit: t,
          headline: transitHeadline(t)
        });
      });

      model.activatedChannels.forEach(ch => {
        if (ch.completedByTransit) return;
        const dimKey = GATE_INFO[ch.a].dimension;
        if (!buckets[dimKey]) buckets[dimKey] = [];
        buckets[dimKey].push({
          impactKey: "channelNative",
          kind: "channel",
          channel: ch,
          headline: BL("Bekanntes Muster", "Known pattern")
        });
      });

      return buckets;
    }

    function groupTransitsByDimension(profile, model, excludeIds = null) {
      const buckets = collectTransitEntries(profile, model, excludeIds);
      return DIMENSION_ORDER.filter(k => buckets[k]?.length).map(k => dimensionGroup(k, buckets[k], profile, model));
    }

    function transitImpact(profile, transit, model) {
      const gate = transit.gate;
      const center = transit.center || gateCenter(gate);
      const centerDefined = profile.definedCenters.includes(center);
      const gateInChart = profile.definedGates.includes(gate);
      const completesChannel = model.activatedChannels.some(ch =>
        ch.completedByTransit && (ch.a === gate || ch.b === gate)
      );
      if (completesChannel && !centerDefined) return "borrowedDefinition";
      if (gateInChart) return "ownAmplification";
      if (!centerDefined) return "openConditioning";
      return "definedNuance";
    }

    function tempDefinedOpenCenters(profile, model) {
      const open = Object.keys(CENTER_LABELS).filter(c => !profile.definedCenters.includes(c));
      return open.filter(c =>
        model.activatedChannels.some(ch =>
          ch.completedByTransit && (ch.from === c || ch.to === c)
        )
      );
    }

      const dim = T(DIMENSIONS[GATE_INFO[transit.gate].dimension].label);
      const hint = PLANET_ENERGY_HINTS[transit.id] ? T(PLANET_ENERGY_HINTS[transit.id]) : "";

      if (impact === "borrowedDefinition") {

      const strategy = T(profile.strategy || "").toLowerCase();
      if (strategy.includes("einladung") || strategy.includes("invitation")) return MANTRA_SECOND_LINES.invitation;
      if (strategy.includes("inform")) return MANTRA_SECOND_LINES.inform;
      if (strategy.includes("reag") || strategy.includes("respond")) return MANTRA_SECOND_LINES.respond;
      return null;
    }

    function pickFocusDimension(profile, model, baseline) {
      const values = model.values;
      const deltas = baseline
        ? Object.fromEntries(DIMENSION_ORDER.map(d => [d, values[d] - baseline.values[d]]))
        : Object.fromEntries(DIMENSION_ORDER.map(d => [d, 0]));
      const ranked = [...DIMENSION_ORDER].sort((a, b) => {
        const scoreA = values[a] + Math.max(0, deltas[a]) * 0.85;
        const scoreB = values[b] + Math.max(0, deltas[b]) * 0.85;
        return scoreB - scoreA;
      });
      let focusDim = ranked[0];
      const { sun } = resolveLuminaries(model);
      if (sun) {
        const sunDim = GATE_INFO[sun.gate].dimension;
        const sunScore = values[sunDim] + Math.max(0, deltas[sunDim]) * 0.85;
        const topScore = values[focusDim] + Math.max(0, deltas[focusDim]) * 0.85;
        if (sunScore >= topScore - 0.45) focusDim = sunDim;
      }
      const openCenters = Object.keys(CENTER_LABELS).filter(c => !profile.definedCenters.includes(c));
      const throatActive = openCenters.includes("Throat") && model.transits.some(t => t.center === "Throat");
      if (throatActive && values.expression >= 6.5) focusDim = "expression";
      const authority = T(profile.authority || "").toLowerCase();
      if ((authority.includes("milz") || authority.includes("spleen")) && values.intuition >= values[focusDim] - 0.25) {
        focusDim = "intuition";
      }
      return { focusDim, sun };
    }

    function buildDailyMantra(profile, model, baseline) {
      const { focusDim, sun } = pickFocusDimension(profile, model, baseline);
      const buckets = collectTransitEntries(profile, model, new Set(["sun", "earth", "moon"]));
      const entries = buckets[focusDim] || [];
      const primary = DIMENSION_MANTRAS[focusDim];
      let second = strategyMantraSecond(profile);
      if (entries.some(e => e.impactKey === "borrowedDefinition")) second = MANTRA_SECOND_LINES.borrowed;
      else if (entries.some(e => e.impactKey === "ownAmplification")) second = MANTRA_SECOND_LINES.amplify;
      else if (!entries.length && model.overall < 6) second = MANTRA_SECOND_LINES.quiet;
      const body = second
        ? BL(`${primary.de} ${second.de}`, `${primary.en} ${second.en}`)
        : primary;
      const tag = sun
        ? `${T(DIMENSIONS[focusDim].label)} · ${T(GATE_NAMES[sun.gate])}`
        : T(DIMENSIONS[focusDim].label);
      return { focusDim, body, tag };
    }

    function buildChartMantra(profile, chart) {
      const baseline = computeChartScores(profile, chart);
      const focusDim = [...DIMENSION_ORDER].sort((a, b) => baseline.values[b] - baseline.values[a])[0];
      const primary = DIMENSION_MANTRAS[focusDim];
      const second = strategyMantraSecond(profile);
      const body = second
        ? BL(`${primary.de} ${second.de}`, `${primary.en} ${second.en}`)
        : primary;
      return { focusDim, body, tag: T(DIMENSIONS[focusDim].label) };
    }

    function dimensionHasActiveInfluences(profile, model, dimKey) {
      if (model.mode === "chartOnly") return false;
      const { sun, earth, moon } = resolveLuminaries(model);
      if (sun && GATE_INFO[sun.gate].dimension === dimKey) return true;
      if (earth && GATE_INFO[earth.gate].dimension === dimKey) return true;
      if (moon && GATE_INFO[moon.gate].dimension === dimKey) return true;
      const skip = new Set(["sun", "earth", "moon"]);
      return model.transits.some(t => !skip.has(t.id) && GATE_INFO[t.gate].dimension === dimKey);
    }

    function dimensionFocusGroup(dimKey, entries, profile, model, baseline, tageskern, openDefault) {
      const dim = DIMENSIONS[dimKey];
      const hasContent = !!(tageskern || entries.length);
      const baseValue = baseline?.values[dimKey];
      const value = hasContent ? model.values[dimKey] : (baseValue ?? model.values[dimKey]);
      const byImpact = {};
      entries.forEach(e => {
        if (!byImpact[e.impactKey]) byImpact[e.impactKey] = [];
        byImpact[e.impactKey].push(e);
      });
      const subgroups = IMPACT_ORDER
        .filter(k => byImpact[k]?.length)
        .map(k => impactSubgroup(k, byImpact[k], profile, model, openDefault));
      const kind = entries.length ? groupAccentKind(entries) : "transit";
      const bodyParts = [];
      if (dimKey === "nutrition" && profile.chartComputed) bodyParts.push(renderPhsNutritionCard(profile));
      if (tageskern) bodyParts.push(tageskern);
      if (subgroups.length) {
        bodyParts.push(`<div class="focus-section-label" style="margin-top:${bodyParts.length ? "4px" : "0"}">${T(BL("Heute · Einfluesse", "Today · influences"))}</div>${subgroups.join("")}`);
      }
      if (!hasContent) {
        bodyParts.push(`<p class="focus-empty">${T(BL(
          `Ruhiger Tag — ${value}/10 ist deine Chart-Baseline. Keine Sonne, kein Mond, keine Transite in ${T(dim.label)} heute.`,
          `Quiet day — ${value}/10 is your chart baseline. No sun, moon, or transits in ${T(dim.label)} today.`
        ))}</p>`);
      }
      return `
        <details class="reading-card reading-accordion reading-group focus-dimension ${kind}" ${openDefault ? "open" : ""} data-focus-dim="${dimKey}">
          <summary>
            <span class="acc-head">
              <span class="acc-icon">${dim.icon}</span>
              <span class="acc-field">${T(dim.label)}</span>
              <span class="acc-score">${value}/10</span>
            </span>
            <span class="acc-chevron">▼</span>
          </summary>
          <div class="reading-group-body">${bodyParts.join("")}</div>
        </details>`;
    }

    function renderUnifiedFocusPanel(profile, day, model) {
      if (!profile.chartComputed) {
        return `<section class="panel focus-panel">${renderFocusPanelHead(BL("Tages-Fokus", "Day focus"))}<div class="small-card warning">${T(BL("Tages-Lesung braucht ein gespeichertes Chart.", "Daily reading needs a saved chart."))}</div></section>`;

      if (model.mode === "chartOnly") return renderChartFocusPanel(profile, day, model);
      if (!showTransits) return renderChartFocusPanel(profile, day, model);

      const baseline = computeChartScores(profile, day.chart);
      const luminaries = resolveLuminaries(model);
      const { sun, moon } = luminaries;
      if (!sun) {
        return `<section class="panel focus-panel">${renderFocusPanelHead(BL("Tages-Fokus", "Day focus"))}<div class="small-card warning">${T(BL("Sonnen-Transit nicht verfuegbar.", "Sun transit unavailable."))}</div></section>`;

      }

      const buckets = collectTransitEntries(profile, model, new Set(["sun", "earth", "moon"]));
      const dims = selectedDimension ? [selectedDimension] : DIMENSION_ORDER;
      const groups = dims.map((dimKey, idx) => {
        const openDefault = selectedDimension ? true : idx < 2;
        const tageskern = renderLuminariesForDim(profile, model, dimKey, luminaries, openDefault);

      const info = GATE_INFO[gate];
      const transit = model.transits.filter(t => t.gate === gate).map(t => T(t.name)).join(", ");

      const inPersonality = chart.personalityGates.includes(gate);
      const inDesign = chart.designGates.includes(gate);
      let status;
      if (model.mode === "chartOnly") {

          ? BL("im Chart und heute im Transit aktiv", "active in chart and today's transit")

            : transit
              ? BL(`heute durch ${transit} aktiviert (Transit)`, `activated today by ${transit} (transit)`)

    function scoreConcordanceForType(c, typeId) {
      if (!typeId) return 1;
      const weights = ZEIT_TYPE_CENTER_WEIGHT[typeId] || {};
      let score = 0;
      (c.hd.activations || []).forEach(a => {
        score += weights[a.center] ?? 1;
        if (typeId === "Reflector" && a.body === "Moon") score += 2;
        if ((typeId === "Generator" || typeId === "Manifesting Generator") && a.center === "Sacral") score += 1;
      });
      return score;
    }

    function topConcordancesForType(concordances, typeId, limit = 5) {
      if (!typeId) return concordances.slice(0, limit);
      return [...concordances]
        .sort((a, b) => scoreConcordanceForType(b, typeId) - scoreConcordanceForType(a, typeId))
        .slice(0, limit);
    }

      (c.hd.activations || []).forEach(a => {

    function typeTransitExample(c, typeId) {
      if (!typeId) return "";
      const center = primaryCenterForType(c, typeId);
      const moonHit = (c.hd.activations || []).some(a => a.body === "Moon");
      const examples = TYPE_CENTER_EXAMPLES[typeId];
      const typeLabel = T(zeitTypeById(typeId)?.label || BL(typeId, typeId));
      let text = "";
      if (typeId === "Reflector" && moonHit && examples?.Moon) text = T(examples.Moon);
      else if (center && examples?.[center]) text = T(examples[center]);
      else {
        const lens = ZEIT_TYPE_LENS[typeId];
        text = lens ? T(BL(
          lens.ride.de.split(".")[0],
          lens.ride.en.split(".")[0]
        )) : "";
      }
      return text ? `${typeLabel}: ${text}` : "";
    }

    function parseTypeExample(typeEx) {
      if (!typeEx) return null;
      const idx = typeEx.indexOf(":");
      if (idx < 0) return { label: "", text: typeEx };
      return { label: typeEx.slice(0, idx).trim(), text: typeEx.slice(idx + 1).trim() };
    }

    function renderTypeHero(typeEx) {
      const parsed = parseTypeExample(typeEx);
      if (!parsed?.text) return "";
      return `
        <div class="zeit-type-hero">
          ${parsed.label ? `<span class="zeit-type-hero-label">${parsed.label}</span>` : ""}
          <p class="zeit-type-hero-text">${parsed.text}</p>
        </div>`;
    }

      const jdPeak = c.activity?.jd_peak ?? c.jd_ut;

      ).join("<br>");
      const label = c.astro.aspect
        ? `${c.astro.aspect} (${c.astro.angle}°)`
        : c.astro.phase

            ? `${T(BL("Ingress", "Ingress"))}: ${c.astro.ingress}`

    function createZeitHDEngine(profile) {
      const personal = new Set(profile.definedGates || []);
      return {
        gate_of(longitude) {
          const a = HDEngine.longitudeToActivation(longitude);
          return { gate: a.gate, line: a.line };
        },
        channel_of(gate) {
          const ch = CHANNELS.find(c => c.a === gate || c.b === gate);
          return ch ? ch.key : null;
        },
        center_of(gate) {
          return gateCenter(gate);
        },
        natal_completion(transitGate) {
          if (!profile.chartComputed) return { completes_channel: null, hangs: false };
          const ch = CHANNELS.find(c => (c.a === transitGate || c.b === transitGate) && (personal.has(c.a) || personal.has(c.b)));
          if (!ch) return { completes_channel: null, hangs: false };
          const native = personal.has(ch.a) && personal.has(ch.b);
          return {
            completes_channel: native ? null : ch.key,
            hangs: !native
          };
        }
      };
    }

    function fieldCentersOrdered(centers) {
      const priority = ["Solar", "Root", "Sacral", "Spleen", "Ego", "Throat", "G", "Ajna", "Head"];

        const ia = priority.indexOf(a);
        const ib = priority.indexOf(b);
        return (ia < 0 ? 99 : ia) - (ib < 0 ? 99 : ib);
      });
    }

        "Kurzer Stopp an der Wendemarke — als hielte die Geschichte den Atem an, bevor die Richtung kippt.",
        "A brief pause at the turning point — like the story holding its breath before direction shifts."
      )
    };

    const LUNATION_MEANINGS = {
      new: BL(
        "Neumond — stiller Anfang, Samen im Dunkeln. Noch sieht kaum wer was, aber unter der Oberfläche startet schon was.",
        "New moon — quiet start, seeds in the dark. Few see it yet, but something's already starting underneath."
      ),
      full: BL(
        "Vollmond — alles leuchtet auf, Gefühle werden laut. Was im Verborgenen lief, tritt jetzt ziemlich unübersehbar auf die Bühne.",
        "Full moon — everything lights up, feelings get loud. What ran hidden now walks onto the stage, hard to miss."
      )
    };

    function placementOf(c, bodyName) {
      return (c.astro.placements || []).find(p => p.body === bodyName);
    }

    function renderConcordanceDeutung(shortText, detailText, tier = "primary", tagLabel = null) {
      const detail = detailText?.trim();
      const more = detail && detail !== shortText?.trim()
        ? `<details class="concordance-more"><summary>${T(BL("Mehr dazu …", "Tell me more …"))}</summary><div class="concordance-more-body">${detail}</div></details>`
        : "";
      const tag = tagLabel || T(BL("Deutung", "Interpretation"));
      return `<div class="concordance-deutung concordance-deutung--${tier}"><span class="concordance-deutung-tag">${tag}</span><div class="concordance-deutung-body">${shortText || "—"}</div>${more}</div>`;
    }

    function buildConcordanceHdInterpretation(c, profile) {
      const acts = c.hd.activations || [];
      if (!acts.length) {
        return {
          short: T(BL(
            "Hier rechnet das Feld nur Astro-seitig mit — im Bodygraph gibt's dazu kein Tor (z. B. Chiron). Kein Drama, einfach nicht die HD-Ebene.",
            "The field computes astro-side only here — no gate in the bodygraph (e.g. Chiron). No drama, just not the HD layer."
          )),
          detail: ""
        };
      }

      const centers = [...new Set(acts.map(a => a.center).filter(Boolean))];

      const detailParts = acts.map(a => {
        const planet = zeitBodyLabel(a.body);
        const gateName = GATE_NAMES[a.gate] ? T(GATE_NAMES[a.gate]) : `G${a.gate}`;
        const center = T(CENTER_LABELS[a.center] || a.center);
        const desc = GATE_INFO[a.gate] ? T(GATE_INFO[a.gate].description) : "";
        const ch = a.channel && CHANNEL_INFLUENCE[a.channel]
          ? `<br><em>${T(CHANNEL_INFLUENCE[a.channel])}</em>` : "";
        return `<strong>${planet}</strong> · G${a.gate}.${a.line} (${gateName}, ${center})<br>${desc}${ch}`;
      });

      (c.hd.natal || []).forEach(n => {
        if (!n.completes_channel) return;
        const ch = CHANNELS.find(x => x.key === n.completes_channel);
        if (!ch) return;
        const effect = CHANNEL_INFLUENCE[ch.key];
        detailParts.push(effect
          ? `<strong>${T(BL("Ich-Schicht", "Personal layer"))}</strong> · Kanal ${ch.key}<br>${T(effect)}`
          : `<strong>${T(BL("Ich-Schicht", "Personal layer"))}</strong> · Kanal ${ch.key}`);
      });

      if (centers.length) {
        detailParts.push(`<strong>${T(BL("Feld & Konditionierung", "Field & conditioning"))}</strong><br>${fieldConditioningDetail(centers)}`);
      }

      const gates = acts.map(a => `G${a.gate}.${a.line}`);
      const channels = [...new Set(acts.map(a => a.channel).filter(Boolean))];
      const fieldText = weaveFieldConditioning(centers);
      const ambientCloser = T(FIELD_AMBIENT_CLOSER);

      let short;
      if (acts.length === 1) {
        const a = acts[0];
        const planet = zeitBodyLabel(a.body);
        const gateName = GATE_NAMES[a.gate] ? T(GATE_NAMES[a.gate]) : `G${a.gate}`;
        short = T(BL(
          `${planet} auf Tor ${a.gate} (${gateName}) — exakter Schaltmoment im Kollektiv-Feld. ${fieldText || ""} ${ambientCloser}`,
          `${planet} on gate ${a.gate} (${gateName}) — exact switch moment in the collective field. ${fieldText || ""} ${ambientCloser}`
        ));
      } else if (c.kind === "lunation" || (acts.length === 2 && acts.some(a => a.body === "Sun") && acts.some(a => a.body === "Moon"))) {
        short = T(BL(
          `Sonne und Mond im selben Moment — Tore ${gates.join(" und ")}. Emotionaler Kollektiv-Takt: Stimmung im Raum wird lauter, auch wenn dein Solarplexus definiert ist (zweite Welle obendrauf). ${fieldText} ${ambientCloser}`,
          `Sun and Moon in the same moment — gates ${gates.join(" and ")}. Collective emotional beat: mood in the room gets louder, even if your solar plexus is defined (a second wave on top). ${fieldText} ${ambientCloser}`
        ));
      } else {
        const bodies = acts.map(a => zeitBodyLabel(a.body)).join(" und ");
        const chHint = channels.length && CHANNEL_INFLUENCE[channels[0]]
          ? T(BL(`Kanal ${channels[0]} flackert mit —`, `Channel ${channels[0]} flickers along —`))
          : "";
        short = T(BL(
          `${bodies}, ein Moment: ${gates.join(" trifft ")}. ${chHint} ${fieldText} ${ambientCloser}`,
          `${bodies}, one moment: ${gates.join(" meets ")}. ${chHint} ${fieldText} ${ambientCloser}`
        ));
      }

      const natal = (c.hd.natal || []).filter(n => n.completes_channel);
      if (natal.length && profile.chartComputed) {
        short += " " + T(BL(
          `Für dich persönlich: ein Kanal (${natal.map(n => n.completes_channel).join(", ")}) wird kurzzeitig mitgeschaltet — geliehene Energie, kein Dauer-Upgrade.`,
          `For you personally: a channel (${natal.map(n => n.completes_channel).join(", ")}) briefly switches on — borrowed energy, not a permanent upgrade.`
        ));
      }

      return { short, detail: detailParts.join("<br><br>") };
    }

    function buildConcordanceAstroInterpretation(c) {
      const detailParts = [];
      (c.astro.placements || []).forEach(p => {
        const theme = SIGN_THEMES[p.sign] ? T(SIGN_THEMES[p.sign]) : p.sign;
        detailParts.push(`<strong>${p.body}</strong> · ${p.sign} ${p.deg_in_sign.toFixed(2)}° (${theme})`);
      });

      if (c.astro.aspect && c.bodies.length >= 2) {
        const p1 = zeitBodyLabel(c.bodies[0]);
        const p2 = zeitBodyLabel(c.bodies[1]);
        const flow = ASPECT_FLOW[c.astro.aspect] ? T(ASPECT_FLOW[c.astro.aspect]) : c.astro.aspect;
        const meaning = ASPECT_MEANINGS[c.astro.aspect] ? T(ASPECT_MEANINGS[c.astro.aspect]) : "";
        const pl1 = placementOf(c, c.bodies[0]);
        const pl2 = placementOf(c, c.bodies[1]);
        const s1 = pl1 && SIGN_THEMES[pl1.sign] ? T(SIGN_THEMES[pl1.sign]) : "";
        const s2 = pl2 && SIGN_THEMES[pl2.sign] ? T(SIGN_THEMES[pl2.sign]) : "";
        const signBit = pl1 && pl2
          ? T(BL(
              `${p1} in ${pl1.sign} (${s1}), ${p2} in ${pl2.sign} (${s2}) — die Mischung macht den Ton.`,
              `${p1} in ${pl1.sign} (${s1}), ${p2} in ${pl2.sign} (${s2}) — the blend sets the tone.`
            ))
          : "";
        detailParts.unshift(`<strong>${c.astro.aspect}</strong> · ${c.astro.angle}°<br>${meaning}`);
        const short = [
          T(BL(`${p1} und ${p2} ${flow} — exakt auf ${c.astro.angle}°.`, `${p1} and ${p2} ${flow} — exact at ${c.astro.angle}°.`)),
          signBit,
          meaning
        ].filter(Boolean).join(" ");
        return { short, detail: detailParts.join("<br><br>") };
      }

      if (c.astro.phase) {
        const phaseLabel = c.astro.phase === "new" ? T(BL("Neumond", "New moon")) : T(BL("Vollmond", "Full moon"));
        const meaning = T(LUNATION_MEANINGS[c.astro.phase]);
        const moon = placementOf(c, "Moon") || c.astro.placements?.[1];
        const sign = moon?.sign;
        const theme = sign && SIGN_THEMES[sign] ? T(SIGN_THEMES[sign]) : "";
        detailParts.unshift(`<strong>${phaseLabel}</strong><br>${meaning}`);
        const short = sign
          ? T(BL(
              `${phaseLabel} in ${sign} (${theme}). ${meaning} Stell deine Erwartungen nicht zu hoch — der Kollektiv-Puls ist gerade ${c.astro.phase === "new" ? "leise" : "laut"}.`,
              `${phaseLabel} in ${sign} (${theme}). ${meaning} Don't oversell expectations — the collective pulse is ${c.astro.phase === "new" ? "quiet" : "loud"} right now.`
            ))
          : `${phaseLabel}: ${meaning}`;
        return { short, detail: detailParts.join("<br><br>") };
      }

      if (c.astro.ingress) {
        const body = zeitBodyLabel(c.bodies[0] || "");
        const pl = placementOf(c, c.bodies[0]) || c.astro.placements?.[0];
        const sign = pl?.sign;
        const theme = sign && SIGN_THEMES[sign] ? T(SIGN_THEMES[sign]) : "";
        detailParts.unshift(`<strong>${T(BL("Ingress", "Ingress"))}</strong> · ${c.astro.ingress}`);
        const short = sign
          ? T(BL(
              `${body} zieht gerade um — neues Kapitel in ${sign}, Stimmung: ${theme}. Wie ein Staffelwechsel im Hintergrund: das Kollektiv-Thema kippt leise, aber spürbar.`,
              `${body} is moving house — new chapter in ${sign}, mood: ${theme}. Like a backstage scene change: the collective theme shifts quietly but noticeably.`
            ))
          : T(BL(`${body} wechselt das Zeichen — frisches Kollektiv-Thema.`, `${body} changes sign — fresh collective theme.`));
        return { short, detail: detailParts.join("<br><br>") };
      }

      if (c.astro.station) {
        const body = zeitBodyLabel(c.bodies[0] || "");
        const dir = STATION_MEANINGS[c.astro.station] || STATION_MEANINGS.station;
        const pl = placementOf(c, c.bodies[0]) || c.astro.placements?.[0];
        const sign = pl?.sign;
        const theme = sign && SIGN_THEMES[sign] ? T(SIGN_THEMES[sign]) : "";
        const dirWord = c.astro.station === "retrograde"
          ? T(BL("rückwärts", "retrograde"))
          : c.astro.station === "direct" ? T(BL("vorwärts", "direct")) : T(BL("am Wendepunkt", "at the turning point"));
        detailParts.unshift(`<strong>${T(BL("Station", "Station"))}</strong> · ${body} · ${T(dir)}`);
        const short = sign
          ? T(BL(
              `${body} ${dirWord} in ${sign} (${theme}). ${T(dir)} Typisch: alte ${body}-Themen kommen nochmal hoch, bevor die Richtung wirklich kippt.`,
              `${body} ${dirWord} in ${sign} (${theme}). ${T(dir)} Typical: old ${body} themes resurface before direction truly shifts.`
            ))
          : `${body}: ${T(dir)}`;
        return { short, detail: detailParts.join("<br><br>") };
      }

      return {
        short: T(BL("Exakte Geometrie am Himmel — schau in die Datenzeile oben für die harten Fakten.", "Exact geometry in the sky — see the data line above for hard facts.")),
        detail: detailParts.join("<br><br>")
      };
    }

    function formatDateTimeShort(iso) {
      if (!iso) return "—";
      const d = new Date(iso);
      return d.toLocaleString(lang === "de" ? "de-DE" : "en-US", {
        day: "numeric", month: "short", hour: "2-digit", minute: "2-digit"
      });
    }

    function formatDurationDays(days) {
      if (days <= 0) return "";
      const hours = days * 24;
      if (hours < 1) return T(BL(`~${Math.max(1, Math.round(hours * 60))} Min.`, `~${Math.max(1, Math.round(hours * 60))} min`));
      if (hours < 48) return T(BL(`~${Math.round(hours)} Std.`, `~${Math.round(hours)} h`));
      return T(BL(`~${days.toFixed(1)} Tage`, `~${days.toFixed(1)} days`));
    }

    function formatActivityRange(c) {
      const a = c.activity;
      if (!a) return formatDateTimeShort(c.jd_iso);
      const from = formatDateTimeShort(a.iso_from);
      const to = formatDateTimeShort(a.iso_to);
      const peak = formatDateTimeShort(a.iso_peak);
      const dur = formatDurationDays(a.duration_days);
      if (Math.abs(a.jd_to - a.jd_from) < 0.0005) {
        return T(BL(`Peak ${peak}`, `Peak ${peak}`));
      }
      const modeHint = {
        orb: T(BL("Aspekt im Orb", "Aspect in orb")),
        sign: T(BL("Planet im Zeichen", "Planet in sign")),
        station: T(BL("Stations-Fenster", "Station window")),
        lunation: T(BL("Lunations-Fenster", "Lunation window")),
        instant: T(BL("Exakt", "Exact"))
      }[a.mode] || "";
      return T(BL(
        `${modeHint}: ${from} – ${to}${dur ? ` (${dur})` : ""} · Peak ${peak}`,
        `${modeHint}: ${from} – ${to}${dur ? ` (${dur})` : ""} · peak ${peak}`
      ));
    }

    function formatScopeWindow(win) {
      if (!win?.isoStart) return "";
      const from = formatDateTimeShort(win.isoStart);
      const to = formatDateTimeShort(win.isoEnd);
      return T(BL(`Betrachtetes Fenster: ${from} – ${to} (UTC)`, `View window: ${from} – ${to} (UTC)`));
    }

    const SWE_BODY_NUM = {
      Sun: 0, Moon: 1, Mercury: 2, Venus: 3, Mars: 4, Jupiter: 5, Saturn: 6,
      Uranus: 7, Neptune: 8, Pluto: 9, TrueNode: 11, Chiron: 15
    };

    function hdGateLineWindow(bodyName, jdPeak, jdMin, jdMax) {
      const bodyNum = SWE_BODY_NUM[bodyName];
      if (bodyNum == null || !window.HDEphemeris?.lonSpeed) return null;
      const keyAt = jd => {
        const lon = HDEphemeris.lonSpeed(jd, bodyNum).longitude;
        const act = HDEngine.longitudeToActivation(lon);
        return `${act.gate}.${act.line}`;
      };
      const peakKey = keyAt(jdPeak);
      let jdFrom = jdPeak;
      let jdTo = jdPeak;
      const step = bodyName === "Moon" ? 0.002 : bodyName === "Sun" ? 0.02 : 0.01;
      for (let jd = jdPeak - step; jd >= jdMin; jd -= step) {
        if (keyAt(jd) !== peakKey) break;
        jdFrom = jd;
      }
      for (let jd = jdPeak + step; jd <= jdMax; jd += step) {
        if (keyAt(jd) !== peakKey) break;
        jdTo = jd;
      }
      const ms = jdUt => (jdUt - 2440587.5) * 86400000;
      return {
        jd_from: jdFrom,
        jd_to: jdTo,
        iso_from: new Date(ms(jdFrom)).toISOString(),
        iso_to: new Date(ms(jdTo)).toISOString(),
        duration_days: jdTo - jdFrom
      };
    }

    function renderHdActivationLine(a, jdPeak, win) {
      const base = `${a.body}: G${a.gate}.${a.line}${a.channel ? ` (${a.channel})` : ""} · ${T(CENTER_LABELS[a.center] || a.center)}`;
      const gl = hdGateLineWindow(a.body, jdPeak, win.jdStart, win.jdEnd);
      if (!gl) return base;
      const dur = formatDurationDays(gl.duration_days);
      return `${base}<span class="concordance-time">${T(BL("Tor/Linie aktiv", "Gate/line active"))}: ${formatDateTimeShort(gl.iso_from)} – ${formatDateTimeShort(gl.iso_to)}${dur ? ` · ${dur}` : ""}</span>`;
    }

    function renderHeuteView(profile, date) {
      if (!window.HDEngine?.hasEphemeris() || !window.ZeitqualitaetCore) {
        return `<section class="panel warning">${T(BL("Swiss Ephemeris oder Zeitqualitaets-Kern nicht geladen.", "Swiss Ephemeris or time-quality core not loaded."))}</section>`;
      }
      const win = ZeitqualitaetCore.windowJds(date, zeitScope);
      if (!win) return `<section class="panel warning">${T(BL("Ephemeris nicht bereit.", "Ephemeris not ready."))}</section>`;
      const engine = createZeitHDEngine(profile);
      let concordances = [];
      try {
        concordances = ZeitqualitaetCore.concordancesForWindow(
          win.jdStart, win.jdEnd, engine, null, profile.id
        );
      } catch (err) {
        return `<section class="panel warning">${T(BL("Berechnung fehlgeschlagen", "Calculation failed"))}: ${err.message}</section>`;
      }
      const addedRecords = persistConcordanceBatch(concordances, {
        scope: zeitScope,
        dateISO: isoDate(date),
        chartId: profile.chartComputed ? profile.id : null
      });
      const datasetCount = concordanceRecordCount();
      const collectiveGates = collectiveGatesForWindow(concordances);
      const scopeLabel = zeitScope === "week"
        ? T(BL("Woche", "Week"))
        : zeitScope === "month" ? T(BL("Monat", "Month")) : T(BL("Tag", "Day"));

      return `

        <section class="panel">
          <div class="zeit-toolbar">
            <h2 style="margin:0;font-size:1.1rem">${T(BL("Zeitqualitaet", "Time quality"))} · ${scopeLabel}</h2>

              <button type="button" class="btn ${zeitScope === "day" ? "active" : ""}" data-zeit-scope="day">${T(BL("Tag", "Day"))}</button>
              <button type="button" class="btn ${zeitScope === "week" ? "active" : ""}" data-zeit-scope="week">${T(BL("Woche", "Week"))}</button>
              <button type="button" class="btn ${zeitScope === "month" ? "active" : ""}" data-zeit-scope="month">${T(BL("Monat", "Month"))}</button>
            </div>
          </div>
          <div class="zeit-window-banner">${formatScopeWindow(win)}</div>
          <h3 style="font-size:.82rem;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);margin:0 0 10px">${T(BL("Human Design", "Human Design"))}</h3>
          ${renderZeitUnifiedView(concordances, collectiveGates, win, profile, datasetCount, addedRecords)}
        </section>`;
    }

    function renderOpenCentersBlock(profile, day) {
      const model = day.display;
      const openCenters = Object.keys(CENTER_LABELS).filter(c => !profile.definedCenters.includes(c));
      if (!openCenters.length) {
        return `<div class="small-card">${T(BL("Alle Zentren definiert.", "All centers defined."))}</div>`;
      }

      const centerOfTransit = t => t.center || gateCenter(t.gate);
      const borrowed = showTransits && model.mode !== "chartOnly" ? tempDefinedOpenCenters(profile, model) : [];
      const pressured = showTransits && model.mode !== "chartOnly"
        ? openCenters.filter(c => model.transits.some(t => centerOfTransit(t) === c && !["sun", "earth", "moon"].includes(t.id)))
        : [];
      const activeToday = [...new Set([...borrowed, ...pressured])];

      const renderCenterCard = (center, active) => {
        const transitsOnCenter = showTransits && model.mode !== "chartOnly"
          ? model.transits.filter(t => centerOfTransit(t) === center && !["sun", "earth", "moon"].includes(t.id))
          : [];
        const footer = transitsOnCenter.length
          ? `<div class="acc-astro-stack" style="margin-top:8px;padding-top:8px;border-top:1px solid rgba(255,255,255,.08)">${transitsOnCenter.map(t => {
              const ch = channelForTransitGate(model, t.gate);
              const chLabel = ch ? ` · Kanal ${ch.a}–${ch.b}` : "";
              return transitAstroLine(t) + chLabel;
            }).join("<br>")}</div>`
          : "";
        return `<div class="small-card ${active ? "warning" : ""}" style="margin-bottom:8px;${active ? "" : "opacity:.72"}"><strong>${T(CENTER_LABELS[center])}</strong>${active ? ` <span style="font-size:.72rem;color:var(--warn)">· ${T(BL("heute aktiv", "active today"))}</span>` : ""}<br><span style="font-size:.88rem;line-height:1.45">${T(OPEN_CENTER_WARNINGS[center])}</span>${footer}</div>`;
      };

      if (activeToday.length) {
        const inactive = openCenters.filter(c => !activeToday.includes(c));
        return `
          ${activeToday.map(c => renderCenterCard(c, true)).join("")}
          ${inactive.length ? `
            <details class="reading-card reading-accordion" style="margin-top:4px">
              <summary style="padding:10px 12px;font-size:.82rem;color:var(--muted)">${T(BL(`${inactive.length} weitere offene Zentren`, `${inactive.length} more open centers`))}</summary>
              <div style="padding:4px 4px 8px">${inactive.map(c => renderCenterCard(c, false)).join("")}</div>
            </details>` : ""}`;
      }

      return openCenters.map(c => renderCenterCard(c, false)).join("");
    }

    function transitCardKind(profile, transit, model) {
      const impact = transitImpact(profile, transit, model);
      if (impact === "borrowedDefinition") return "transit-open";
      if (impact === "ownAmplification") return "transit-hit";
      if (impact === "openConditioning") return "transit-open";
      return "transit";

      return { label: BL("Leer", "Empty"), cls: "muted" };
