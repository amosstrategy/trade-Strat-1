<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Daily Energy Map</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0d1117;
      --bg-soft: #151b25;
      --bg-card: #1b2330;
      --line: #2d3748;
      --text: #edf2f7;
      --muted: #a7b1c2;
      --accent: #84dcc6;
      --accent-2: #f6c177;
      --good: #71e39b;
      --warn: #ffd166;
      --low: #ff7a7a;
      --defined: #d7a4ff;
      --transit: #84dcc6;
      --both: #f6c177;
      --shadow: 0 24px 80px rgba(0,0,0,.32);
      --radius: 22px;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at 20% 0%, rgba(132,220,198,.16), transparent 34rem),
        radial-gradient(circle at 90% 10%, rgba(246,193,119,.12), transparent 36rem),
        var(--bg);
      color: var(--text);
    }

    button, select, input {
      font: inherit;
      color: inherit;
    }

    button, select {
      border: 1px solid var(--line);
      background: rgba(255,255,255,.04);
      border-radius: 999px;
      padding: .72rem 1rem;
      cursor: pointer;
      transition: border-color .2s, background .2s, transform .2s;
    }

    button:hover, select:hover {
      border-color: var(--accent);
      background: rgba(132,220,198,.08);
      transform: translateY(-1px);
    }

    .app {
      width: min(1440px, calc(100% - 32px));
      margin: 0 auto;
      padding: 28px 0 48px;
    }

    .hero {
      display: grid;
      grid-template-columns: 1.2fr .8fr;
      gap: 22px;
      align-items: stretch;
      margin-bottom: 22px;
    }

    .panel, .hero-card {
      border: 1px solid rgba(255,255,255,.08);
      background: linear-gradient(180deg, rgba(255,255,255,.055), rgba(255,255,255,.025));
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }

    .hero-card {
      padding: 30px;
      min-height: 310px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .eyebrow {
      color: var(--accent);
      letter-spacing: .18em;
      text-transform: uppercase;
      font-size: .78rem;
      font-weight: 700;
    }

    h1, h2, h3, p { margin-top: 0; }
    h1 {
      font-size: clamp(2.35rem, 5vw, 5rem);
      line-height: .92;
      letter-spacing: -.06em;
      margin-bottom: 1.1rem;
    }

    .lead {
      color: var(--muted);
      font-size: clamp(1.05rem, 1.8vw, 1.35rem);
      max-width: 62rem;
      line-height: 1.55;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      margin-top: 24px;
    }

    .score-card {
      padding: 26px;
      display: grid;
      gap: 18px;
    }

    .score-ring {
      width: 190px;
      height: 190px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      margin: 0 auto;
      background: conic-gradient(var(--ring) calc(var(--score) * 10%), rgba(255,255,255,.07) 0);
      position: relative;
    }

    .score-ring::before {
      content: "";
      position: absolute;
      inset: 15px;
      border-radius: inherit;
      background: var(--bg-soft);
    }

    .score-ring strong {
      position: relative;
      font-size: 3.6rem;
      letter-spacing: -.08em;
    }

    .score-ring span {
      position: relative;
      color: var(--muted);
      align-self: end;
    }

    .date-line {
      color: var(--muted);
      text-align: center;
      margin-bottom: 0;
    }

    .grid {
      display: grid;
      grid-template-columns: minmax(320px, .88fr) minmax(420px, 1.35fr) minmax(320px, .92fr);
      gap: 18px;
      align-items: start;
    }

    .panel {
      padding: 20px;
      overflow: hidden;
    }

    .panel h2 {
      font-size: 1rem;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 14px;
    }

    .profile-card {
      display: grid;
      gap: 12px;
      margin-bottom: 18px;
    }

    .tag-row, .metric-row, .planet-grid, .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .tag, .chip, .metric {
      border: 1px solid rgba(255,255,255,.08);
      background: rgba(255,255,255,.045);
      border-radius: 999px;
      padding: .45rem .72rem;
      color: var(--muted);
      font-size: .88rem;
    }

    .tag strong, .metric strong { color: var(--text); }
    .metric { display: inline-flex; gap: 7px; align-items: center; }

    .reading {
      background: rgba(132,220,198,.08);
      border: 1px solid rgba(132,220,198,.2);
      border-radius: 18px;
      padding: 16px;
      line-height: 1.55;
      color: #dceee9;
      margin-bottom: 16px;
    }

    .dimension {
      display: grid;
      gap: 6px;
      margin: 11px 0;
    }

    .dimension-head {
      display: flex;
      justify-content: space-between;
      color: var(--muted);
      font-size: .92rem;
    }

    .bar {
      height: 10px;
      border-radius: 999px;
      background: rgba(255,255,255,.07);
      overflow: hidden;
    }

    .bar > i {
      display: block;
      height: 100%;
      width: calc(var(--value) * 10%);
      background: linear-gradient(90deg, var(--ring), var(--accent));
      border-radius: inherit;
    }

    .bodygraph-wrap {
      display: grid;
      gap: 14px;
    }

    svg {
      width: 100%;
      height: auto;
      display: block;
      background: rgba(0,0,0,.14);
      border-radius: 18px;
      border: 1px solid rgba(255,255,255,.07);
    }

    .center-shape {
      fill: rgba(255,255,255,.055);
      stroke: rgba(255,255,255,.35);
      stroke-width: 2;
      cursor: pointer;
    }

    .center-shape.defined { fill: rgba(215,164,255,.58); stroke: rgba(215,164,255,.95); }
    .channel-line { stroke: rgba(255,255,255,.13); stroke-width: 8; stroke-linecap: round; }
    .channel-line.active-personal { stroke: rgba(215,164,255,.58); }
    .channel-line.active-transit { stroke: rgba(132,220,198,.58); }
    .channel-line.active-both { stroke: rgba(246,193,119,.78); }
    .gate-dot { fill: #222b38; stroke: rgba(255,255,255,.38); stroke-width: 1.5; cursor: pointer; }
    .gate-dot.personal { fill: var(--defined); stroke: #fff; }
    .gate-dot.transit { fill: var(--transit); stroke: #fff; }
    .gate-dot.both { fill: var(--both); stroke: #fff; }
    .gate-label { fill: var(--text); font-size: 10px; font-weight: 700; pointer-events: none; text-anchor: middle; dominant-baseline: central; }
    .center-label { fill: rgba(255,255,255,.72); font-size: 11px; font-weight: 700; pointer-events: none; text-anchor: middle; text-transform: uppercase; letter-spacing: .06em; }

    .detail-box, .small-card {
      border-radius: 16px;
      background: rgba(255,255,255,.045);
      border: 1px solid rgba(255,255,255,.08);
      padding: 14px;
      color: var(--muted);
      line-height: 1.48;
    }

    .detail-box strong, .small-card strong { color: var(--text); }
    .small-card { margin-bottom: 10px; }

    .planet-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
    }

    .planet {
      border-radius: 14px;
      background: rgba(255,255,255,.045);
      padding: 10px;
      border: 1px solid rgba(255,255,255,.08);
    }

    .planet b { display: block; font-size: .88rem; }
    .planet span { color: var(--muted); font-size: .82rem; }

    .penta-members {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
      margin-bottom: 12px;
    }

    .member-toggle {
      display: flex;
      gap: 8px;
      align-items: center;
      border: 1px solid rgba(255,255,255,.08);
      padding: 10px;
      border-radius: 14px;
      background: rgba(255,255,255,.035);
      cursor: pointer;
      color: var(--muted);
      font-size: .9rem;
    }

    .member-toggle input { accent-color: var(--accent); }

    .warning {
      border-color: rgba(255,209,102,.28);
      background: rgba(255,209,102,.08);
    }

    .footer {
      color: var(--muted);
      text-align: center;
      margin: 22px 0 0;
      font-size: .9rem;
    }

    @media (max-width: 1120px) {
      .hero, .grid { grid-template-columns: 1fr; }
      .score-card { order: -1; }
    }

    @media (max-width: 620px) {
      .app { width: min(100% - 18px, 1440px); padding-top: 12px; }
      .hero-card, .panel { padding: 16px; }
      .planet-grid, .penta-members { grid-template-columns: 1fr; }
      h1 { font-size: 2.55rem; }
    }
  </style>
</head>

    function scoreFor(profile, date) {
      const transits = transitsFor(date);

      const values = Object.fromEntries(Object.keys(DIMENSIONS).map(dim => [dim, 4.2]));

      transits.forEach(t => {

        if (!profile.definedCenters.includes(t.center)) values.clarity -= .15;
      });

      CHANNELS.forEach(channel => {
        const personalA = personal.has(channel.a), personalB = personal.has(channel.b);
        const transitA = transitGates.has(channel.a), transitB = transitGates.has(channel.b);
        const completedByTransit = (personalA && transitB) || (personalB && transitA);
        const nativeChannel = personalA && personalB;
        if (completedByTransit || nativeChannel) {
          const dimA = GATE_INFO[channel.a].dimension;
          const dimB = GATE_INFO[channel.b].dimension;
          values[dimA] += completedByTransit ? 1.4 : .45;
          values[dimB] += completedByTransit ? .9 : .35;
          activatedChannels.push({ ...channel, completedByTransit, nativeChannel });
        }
      });

      if (transitGates.has(14) || transitGates.has(45) || transitGates.has(26)) values.energy += .9;
      if (transitGates.has(57) || transitGates.has(48)) values.intuition += .9;

      let shape = "";
      if (l.type === "rect") {
        shape = `<rect class="${cls}" data-center="${center}" x="${l.x}" y="${l.y}" width="${l.w}" height="${l.h}" rx="14"></rect>`;
      } else if (l.type === "diamond") {
        shape = `<polygon class="${cls}" data-center="${center}" points="${l.x + l.w / 2},${l.y} ${l.x + l.w},${l.y + l.h / 2} ${l.x + l.w / 2},${l.y + l.h} ${l.x},${l.y + l.h / 2}"></polygon>`;
      } else if (l.type === "triangle-right") {
        shape = `<polygon class="${cls}" data-center="${center}" points="${l.x},${l.y} ${l.x + l.w},${l.y + l.h / 2} ${l.x},${l.y + l.h}"></polygon>`;
      } else if (l.type === "triangle-left") {
        shape = `<polygon class="${cls}" data-center="${center}" points="${l.x + l.w},${l.y} ${l.x},${l.y + l.h / 2} ${l.x + l.w},${l.y + l.h}"></polygon>`;
      } else {
        shape = `<polygon class="${cls}" data-center="${center}" points="${l.x + l.w / 2},${l.y} ${l.x + l.w},${l.y + l.h} ${l.x},${l.y + l.h}"></polygon>`;
      }
      return shape + label;
    }

    function renderBodygraph(profile, model) {
      const personal = new Set(profile.definedGates);
      const channels = CHANNELS.map(channel => {
        const p1 = gateCoords[channel.a], p2 = gateCoords[channel.b];
        return `<line class="channel-line ${activeChannelClass(channel, profile, model)}" x1="${p1[0]}" y1="${p1[1]}" x2="${p2[0]}" y2="${p2[1]}"></line>`;
      }).join("");
      const centers = Object.keys(CENTER_LAYOUT).map(center => shapeFor(center, profile.definedCenters.includes(center))).join("");
      const gates = Object.entries(gateCoords).map(([gate, xy]) => {
        const g = Number(gate);
        const personalClass = personal.has(g);
        const transitClass = model.transitGates.has(g);
        const cls = personalClass && transitClass ? "both" : personalClass ? "personal" : transitClass ? "transit" : "";
        return `<g data-gate="${g}"><circle class="gate-dot ${cls}" cx="${xy[0]}" cy="${xy[1]}" r="12"></circle><text class="gate-label" x="${xy[0]}" y="${xy[1]}">${g}</text></g>`;
      }).join("");
      return `<svg viewBox="0 0 660 820" role="img" aria-label="Bodygraph">${channels}${centers}${gates}</svg>`;
    }

    function detailForGate(profile, model, gate) {
      const info = GATE_INFO[gate];
      const transit = model.transits.filter(t => t.gate === gate).map(t => T(t.name)).join(", ");
      const personal = profile.definedGates.includes(gate);
      const status = personal && transit ? BL("im Chart und heute im Transit aktiv", "active in chart and today's transit") : personal ? BL("im Chart definiert", "defined in chart") : transit ? BL(`heute durch ${transit} aktiviert`, `activated today by ${transit}`) : BL("nicht aktiv, aber als Referenz sichtbar", "not active, visible as reference");
      return `<strong>Tor ${gate}: ${T(info.name)}</strong><br>${T(status)}.<br>${T(info.description)}<br><span>${T(CENTER_LABELS[info.center])} | ${T(DIMENSIONS[info.dimension].label)}</span>`;
    }

    function renderProfilePanel(profile, model) {
      const openCenters = Object.keys(CENTER_LABELS).filter(center => !profile.definedCenters.includes(center));
      return `
        <section class="panel">
          <h2>${T(BL("Profil", "Profile"))}</h2>
          <div class="profile-card">
            <select id="profileSelect" aria-label="Profile">
              ${Object.values(PROFILES).map(p => `<option value="${p.id}" ${p.id === profile.id ? "selected" : ""}>${p.name}</option>`).join("")}
            </select>
            <div class="small-card">
              <strong>${profile.name}</strong><br>
              ${T(profile.subtitle)}<br><br>
              <span>${T(BL("Autoritaet", "Authority"))}: ${T(profile.authority)}</span><br>
              <span>${T(BL("Strategie", "Strategy"))}: ${T(profile.strategy)}</span>
            </div>
            <div class="tag-row">
              ${profile.definedCenters.map(center => `<span class="tag"><strong>${T(CENTER_LABELS[center])}</strong></span>`).join("")}
            </div>
          </div>
          <div class="reading">${dailyReading(profile, model)}</div>
          <h2>${T(BL("Offene Zentren", "Open centers"))}</h2>
          ${openCenters.slice(0, 5).map(center => `<div class="small-card warning"><strong>${T(CENTER_LABELS[center])}</strong><br>${T(OPEN_CENTER_WARNINGS[center])}</div>`).join("")}
          <h2>${T(BL("Traum-Notiz", "Dream note"))}</h2>
          <div class="small-card">${T(DREAM_CARDS[(daysSinceEpoch(currentDate()) + profile.definedGates.length) % DREAM_CARDS.length])}</div>
        </section>`;
    }

    function renderScores(model) {
      return Object.entries(model.values).map(([dim, value]) => `
        <div class="dimension">
          <div class="dimension-head"><span>${T(DIMENSIONS[dim].label)}</span><strong>${value}/10</strong></div>
          <div class="bar" style="--value:${value};--ring:${ringColor(value)}"><i></i></div>
        </div>
      `).join("");
    }

    function renderTransitPanel(model) {
      return `
        <section class="panel">
          <h2>${T(BL("Transite", "Transits"))}</h2>
          <div class="planet-grid">
            ${model.transits.map(t => `<div class="planet"><b>${T(t.name)}</b><span>${transitAddress(t)}<br>${T(GATE_INFO[t.gate].name)}</span></div>`).join("")}
          </div>
          <h2 style="margin-top:18px">${T(BL("Aktive Kanaele", "Active channels"))}</h2>
          ${model.activatedChannels.length ? model.activatedChannels.slice(0, 6).map(c => `<div class="small-card"><strong>${c.a}-${c.b}</strong><br>${T(GATE_INFO[c.a].name)} + ${T(GATE_INFO[c.b].name)}</div>`).join("") : `<div class="small-card">${T(BL("Heute wird kein persoenlicher Kanal voll aktiviert. Das spricht fuer Beobachten statt Forcieren.", "No personal channel is fully activated today. This supports observing rather than forcing."))}</div>`}
          <h2>${T(BL("Synergie", "Synergy"))}</h2>
          <div class="small-card">${T(SYNERGY_CARDS[daysSinceEpoch(currentDate()) % SYNERGY_CARDS.length])}</div>
        </section>`;
    }

    function renderPenta(date) {
      const members = Object.values(PROFILES).filter(profile => pentaOn[profile.id]);
      const gatePool = new Set(members.flatMap(profile => profile.definedGates));
      const completed = PENTA_CHANNELS.filter(channel => gatePool.has(channel.a) && gatePool.has(channel.b));
      const triggerCenters = Object.keys(TRIGGER_TEXTS).filter(center => CENTER_GATES[center].some(gate => gatePool.has(gate)));
      return `
        <section class="panel">
          <h2>${T(BL("Penta / Team", "Penta / Team"))}</h2>
          <div class="penta-members">
            ${Object.values(PROFILES).map(p => `
              <label class="member-toggle">
                <input type="checkbox" data-member="${p.id}" ${pentaOn[p.id] ? "checked" : ""}>
                <span>${p.name}</span>
              </label>`).join("")}
          </div>
          <div class="small-card">
            <strong>${T(BL("Gate-Pool", "Gate pool"))}</strong><br>
            ${members.length ? Array.from(gatePool).sort((a,b) => a - b).join(", ") : T(BL("Kein Mitglied aktiv.", "No member active."))}
          </div>
          <h2>${T(BL("Vollstaendige Penta-Kanaele", "Complete Penta channels"))}</h2>
          ${completed.length ? completed.map(c => `<div class="small-card"><strong>${c.a}-${c.b} | ${T(c.name)}</strong><br>${T(c.text)}</div>`).join("") : `<div class="small-card">${T(BL("Noch kein Penta-Kanal ist vollstaendig. Gut fuer lose Abstimmung, weniger fuer finale Gruppenentscheidungen.", "No Penta channel is complete yet. Good for loose alignment, less for final group decisions."))}</div>`}
          <h2>${T(BL("Trigger ausserhalb des Kerns", "Triggers outside the core"))}</h2>
          ${triggerCenters.map(center => `<div class="small-card warning"><strong>${T(CENTER_LABELS[center])}</strong><br>${T(TRIGGER_TEXTS[center])}</div>`).join("") || `<div class="small-card">${T(BL("Keine starken Rand-Trigger im aktuellen Team-Pool.", "No strong edge triggers in the current team pool."))}</div>`}
        </section>`;
    }

    function renderApp() {
      const profile = PROFILES[activeProfile];
      const date = currentDate();
      const model = scoreFor(profile, date);
      const scoreLabel = model.overall >= 7 ? BL("stark", "strong") : model.overall >= 5 ? BL("steuerbar", "steerable") : BL("ruhig", "quiet");
      document.documentElement.lang = lang;
      document.getElementById("app").innerHTML = `
        <section class="hero">
          <div class="hero-card">
            <div>
              <div class="eyebrow">${T(BL("Daily Energy Map", "Daily Energy Map"))}</div>
              <h1>${T(BL("Wann ist der beste Moment fuer was?", "When is the best moment for what?"))}</h1>
              <p class="lead">${T(BL("Eine lokale, taegliche Karte fuer Person, Marke und Team: Transit-Gates, definierte Zentren, Abundance-Fenster und praktische Sprache ohne Fachjargon.", "A local daily map for person, brand, and team: transit gates, defined centers, abundance windows, and practical language without jargon."))}</p>
            </div>
            <div class="toolbar">
              <button id="prevDay" type="button">${T(BL("Zurueck", "Previous"))}</button>
              <button id="todayBtn" type="button">${T(BL("Heute", "Today"))}</button>
              <button id="nextDay" type="button">${T(BL("Weiter", "Next"))}</button>
              <button id="langBtn" type="button">${lang === "de" ? "EN" : "DE"}</button>
            </div>
          </div>
          <div class="hero-card score-card">
            <p class="date-line">${date.toLocaleDateString(lang === "de" ? "de-DE" : "en-US", { weekday: "long", year: "numeric", month: "long", day: "numeric" })}</p>
            <div class="score-ring" style="--score:${model.overall};--ring:${ringColor(model.overall)}">
              <strong>${model.overall}</strong>
            </div>
            <p class="date-line">${T(BL("Gesamtscore", "Overall score"))}: ${T(scoreLabel)} ${model.abundance ? "· " + T(BL("Abundance-Fenster offen", "abundance window open")) : ""}</p>
            <div class="metric-row">
              <span class="metric"><strong>${model.transits.length}</strong> ${T(BL("Planeten", "planets"))}</span>
              <span class="metric"><strong>${model.transitGates.size}</strong> ${T(BL("Transit-Gates", "transit gates"))}</span>
              <span class="metric"><strong>${model.activatedChannels.length}</strong> ${T(BL("Kanaele", "channels"))}</span>
            </div>
          </div>
        </section>

        <section class="grid">
          ${renderProfilePanel(profile, model)}
          <section class="panel bodygraph-wrap">
            <h2>${T(BL("Live Bodygraph", "Live bodygraph"))}</h2>
            ${renderBodygraph(profile, model)}
            <div class="chips">
              <span class="chip">${T(BL("Violett: definiert", "Purple: defined"))}</span>
              <span class="chip">${T(BL("Gruen: Transit", "Green: transit"))}</span>
              <span class="chip">${T(BL("Gold: beides", "Gold: both"))}</span>
            </div>
            <div class="detail-box" id="detailBox"><strong>${T(BL("Klicke ein Tor oder Zentrum.", "Click a gate or center."))}</strong><br>${T(profile.tone)}</div>
            <h2>${T(BL("6 Dimensionen", "6 dimensions"))}</h2>
            ${renderScores(model)}
          </section>
          <div>
            ${renderTransitPanel(model)}
            ${renderPenta(date)}
          </div>
        </section>
        <p class="footer">${T(BL("Offline-faehig: eine HTML-Datei, keine Libraries, keine Datenbank, keine Netzwerkaufrufe.", "Offline-capable: one HTML file, no libraries, no database, no network calls."))}</p>
      `;

      bindEvents(profile, model);
    }

    function bindEvents(profile, model) {
      document.getElementById("prevDay").addEventListener("click", () => { dayIndex -= 1; renderApp(); });
      document.getElementById("nextDay").addEventListener("click", () => { dayIndex += 1; renderApp(); });
      document.getElementById("todayBtn").addEventListener("click", () => { dayIndex = 0; renderApp(); });
      document.getElementById("langBtn").addEventListener("click", () => { lang = lang === "de" ? "en" : "de"; renderApp(); });
      document.getElementById("profileSelect").addEventListener("change", event => { activeProfile = event.target.value; renderApp(); });
      document.querySelectorAll("[data-gate]").forEach(node => node.addEventListener("click", () => {
        document.getElementById("detailBox").innerHTML = detailForGate(profile, model, Number(node.dataset.gate));
      }));
      document.querySelectorAll("[data-center]").forEach(node => node.addEventListener("click", () => {
        const center = node.dataset.center;
        const defined = profile.definedCenters.includes(center);
        const profileNote = PROFILE_CENTER_NOTES[profile.id][center] || CENTER_DESCRIPTIONS[center];
        document.getElementById("detailBox").innerHTML = `<strong>${T(CENTER_LABELS[center])}</strong><br>${T(profileNote)}<br><span>${defined ? T(BL("Bei diesem Profil definiert.", "Defined in this profile.")) : T(OPEN_CENTER_WARNINGS[center])}</span>`;
      }));
      document.querySelectorAll("[data-member]").forEach(node => node.addEventListener("change", event => {
        pentaOn[event.target.dataset.member] = event.target.checked;
        renderApp();
      }));
    }

    renderApp();
  </script>
</body>
</html>
