<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Daily Energy Map</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0d1117;
      --bg-soft: #151b25;
      --bg-card: #1b2330;
      --line: #2d3748;
      --text: #edf2f7;
      --muted: #a7b1c2;
      --accent: #84dcc6;
      --accent-2: #f6c177;
      --good: #71e39b;
      --warn: #ffd166;
      --low: #ff7a7a;
      --defined: #d7a4ff;
      --transit: #84dcc6;
      --both: #f6c177;
      --shadow: 0 24px 80px rgba(0,0,0,.32);
      --radius: 22px;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at 20% 0%, rgba(132,220,198,.16), transparent 34rem),
        radial-gradient(circle at 90% 10%, rgba(246,193,119,.12), transparent 36rem),
        var(--bg);
      color: var(--text);
    }

    button, select, input {
      font: inherit;
      color: inherit;
    }

    button, select, input {
      border: 1px solid var(--line);
      background: rgba(255,255,255,.04);
      border-radius: 999px;
      padding: .72rem 1rem;
    }

    button, select {
      cursor: pointer;
      transition: border-color .2s, background .2s, transform .2s;
    }

    button:hover, select:hover {
      border-color: var(--accent);
      background: rgba(132,220,198,.08);
      transform: translateY(-1px);
    }

    .app {
      width: min(1440px, calc(100% - 32px));
      margin: 0 auto;
      padding: 28px 0 48px;
    }

    .hero {
      display: grid;
      grid-template-columns: 1.2fr .8fr;
      gap: 22px;
      align-items: stretch;
      margin-bottom: 22px;
    }

    .panel, .hero-card {
      border: 1px solid rgba(255,255,255,.08);
      background: linear-gradient(180deg, rgba(255,255,255,.055), rgba(255,255,255,.025));
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }

    .hero-card {
      padding: 30px;
      min-height: 310px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .eyebrow {
      color: var(--accent);
      letter-spacing: .18em;
      text-transform: uppercase;
      font-size: .78rem;
      font-weight: 700;
    }

    h1, h2, h3, p { margin-top: 0; }
    h1 {
      font-size: clamp(2.35rem, 5vw, 5rem);
      line-height: .92;
      letter-spacing: -.06em;
      margin-bottom: 1.1rem;
    }

    .lead {
      color: var(--muted);
      font-size: clamp(1.05rem, 1.8vw, 1.35rem);
      max-width: 62rem;
      line-height: 1.55;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      margin-top: 24px;
    }

    .score-card {
      padding: 26px;
      display: grid;
      gap: 18px;
    }

    .score-ring {
      width: 190px;
      height: 190px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      margin: 0 auto;
      background: conic-gradient(var(--ring) calc(var(--score) * 10%), rgba(255,255,255,.07) 0);
      position: relative;
    }

    .score-ring::before {
      content: "";
      position: absolute;
      inset: 15px;
      border-radius: inherit;
      background: var(--bg-soft);
    }

    .score-ring strong {
      position: relative;
      font-size: 3.6rem;
      letter-spacing: -.08em;
    }

    .score-ring span {
      position: relative;
      color: var(--muted);
      align-self: end;
    }

    .date-line {
      color: var(--muted);
      text-align: center;
      margin-bottom: 0;
    }

    .grid {
      display: grid;
      grid-template-columns: minmax(320px, .88fr) minmax(420px, 1.35fr) minmax(320px, .92fr);
      gap: 18px;
      align-items: start;
    }

    .panel {
      padding: 20px;
      overflow: hidden;
    }

    .panel h2 {
      font-size: 1rem;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 14px;
    }

    .profile-card {
      display: grid;
      gap: 12px;
      margin-bottom: 18px;
    }

    .tag-row, .metric-row, .planet-grid, .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .tag, .chip, .metric {
      border: 1px solid rgba(255,255,255,.08);
      background: rgba(255,255,255,.045);
      border-radius: 999px;
      padding: .45rem .72rem;
      color: var(--muted);
      font-size: .88rem;
    }

    .tag strong, .metric strong { color: var(--text); }
    .metric { display: inline-flex; gap: 7px; align-items: center; }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      margin-bottom: 12px;
    }

    .field {
      display: grid;
      gap: 6px;
    }

    .field.full { grid-column: 1 / -1; }
    .field label {
      color: var(--muted);
      font-size: .82rem;
    }

    .field input {
      width: 100%;
      border-radius: 14px;
    }

    .status-card {
      border-radius: 16px;
      border: 1px solid rgba(132,220,198,.22);
      background: rgba(132,220,198,.08);
      color: #dceee9;
      padding: 12px 14px;
      margin-bottom: 12px;
      line-height: 1.45;
      font-size: .92rem;
    }

    .status-card.warn {
      border-color: rgba(255,209,102,.28);
      background: rgba(255,209,102,.08);
      color: #f9e8b8;
    }

    .reading {
      background: rgba(132,220,198,.08);
      border: 1px solid rgba(132,220,198,.2);
      border-radius: 18px;
      padding: 16px;
      line-height: 1.55;
      color: #dceee9;
      margin-bottom: 16px;
    }

    .dimension {
      display: grid;
      gap: 6px;
      margin: 11px 0;
    }

    .dimension-head {
      display: flex;
      justify-content: space-between;
      color: var(--muted);
      font-size: .92rem;
    }

    .bar {
      height: 10px;
      border-radius: 999px;
      background: rgba(255,255,255,.07);
      overflow: hidden;
    }

    .bar > i {
      display: block;
      height: 100%;
      width: calc(var(--value) * 10%);
      background: linear-gradient(90deg, var(--ring), var(--accent));
      border-radius: inherit;
    }

    .bodygraph-wrap {
      display: grid;
      gap: 14px;
    }

    svg {
      width: 100%;
      height: auto;
      display: block;
      background: rgba(0,0,0,.14);
      border-radius: 18px;
      border: 1px solid rgba(255,255,255,.07);
    }

    .center-shape {
      fill: rgba(255,255,255,.055);
      stroke: rgba(255,255,255,.35);
      stroke-width: 2;
      cursor: pointer;
    }

    .center-shape.defined { fill: rgba(215,164,255,.58); stroke: rgba(215,164,255,.95); }
    .channel-line { stroke: rgba(255,255,255,.13); stroke-width: 8; stroke-linecap: round; }
    .channel-line.active-personal { stroke: rgba(215,164,255,.58); }
    .channel-line.active-transit { stroke: rgba(132,220,198,.58); }
    .channel-line.active-both { stroke: rgba(246,193,119,.78); }
    .gate-dot { fill: #222b38; stroke: rgba(255,255,255,.38); stroke-width: 1.5; cursor: pointer; }
    .gate-dot.personal { fill: var(--defined); stroke: #fff; }
    .gate-dot.transit { fill: var(--transit); stroke: #fff; }
    .gate-dot.both { fill: var(--both); stroke: #fff; }
    .gate-label { fill: var(--text); font-size: 10px; font-weight: 700; pointer-events: none; text-anchor: middle; dominant-baseline: central; }
    .center-label { fill: rgba(255,255,255,.72); font-size: 11px; font-weight: 700; pointer-events: none; text-anchor: middle; text-transform: uppercase; letter-spacing: .06em; }

    .detail-box, .small-card {
      border-radius: 16px;
      background: rgba(255,255,255,.045);
      border: 1px solid rgba(255,255,255,.08);
      padding: 14px;
      color: var(--muted);
      line-height: 1.48;
    }

    .detail-box strong, .small-card strong { color: var(--text); }
    .small-card { margin-bottom: 10px; }

    .planet-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
    }

    .planet {
      border-radius: 14px;
      background: rgba(255,255,255,.045);
      padding: 10px;
      border: 1px solid rgba(255,255,255,.08);
    }

    .planet b { display: block; font-size: .88rem; }
    .planet span { color: var(--muted); font-size: .82rem; }

    .penta-members {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
      margin-bottom: 12px;
    }

    .member-toggle {
      display: flex;
      gap: 8px;
      align-items: center;
      border: 1px solid rgba(255,255,255,.08);
      padding: 10px;
      border-radius: 14px;
      background: rgba(255,255,255,.035);
      cursor: pointer;
      color: var(--muted);
      font-size: .9rem;
    }

    .member-toggle input { accent-color: var(--accent); }

    .warning {
      border-color: rgba(255,209,102,.28);
      background: rgba(255,209,102,.08);
    }

    .footer {
      color: var(--muted);
      text-align: center;
      margin: 22px 0 0;
      font-size: .9rem;
    }

    @media (max-width: 1120px) {
      .hero, .grid { grid-template-columns: 1fr; }
      .score-card { order: -1; }
    }

    @media (max-width: 620px) {
      .app { width: min(100% - 18px, 1440px); padding-top: 12px; }
      .hero-card, .panel { padding: 16px; }
      .form-grid { grid-template-columns: 1fr; }
      .planet-grid, .penta-members { grid-template-columns: 1fr; }
      h1 { font-size: 2.55rem; }
    }
  </style>
</head>

    function parseUtcOffset(value) {
      const match = String(value || "").trim().match(/^([+-])(\d{1,2})(?::?(\d{2}))?$/);
      if (!match) throw new Error(T(BL("UTC-Offset bitte als +01:00 oder -05:00 eingeben.", "Enter UTC offset as +01:00 or -05:00.")));
      const sign = match[1] === "-" ? -1 : 1;
      const hours = Number(match[2]);
      const minutes = Number(match[3] || "0");
      if (hours > 14 || minutes > 59) throw new Error(T(BL("UTC-Offset ist ausserhalb des gueltigen Bereichs.", "UTC offset is outside the valid range.")));
      return sign * (hours * 60 + minutes);
    }

    function birthDateToUtc(form) {
      if (!form.date || !form.time) throw new Error(T(BL("Geburtsdatum und exakte Uhrzeit sind erforderlich.", "Birth date and exact time are required.")));
      const [year, month, day] = form.date.split("-").map(Number);
      const [hour, minute] = form.time.split(":").map(Number);
      const offsetMinutes = parseUtcOffset(form.utcOffset);
      return new Date(Date.UTC(year, month - 1, day, hour, minute || 0) - offsetMinutes * 60000);
    }

    async function findDesignDate(swe, birthUtc, natalSunLongitude) {
      let low = birthUtc.getTime() - 94 * 86400000;
      let high = birthUtc.getTime() - 82 * 86400000;
      for (let i = 0; i < 36; i++) {
        const mid = (low + high) / 2;
        const jd = dateToJulian(swe, new Date(mid));
        const sun = swe.calculatePosition(jd, SE_PLANET.Sun, swissFlags());
        const distance = norm(natalSunLongitude - sun.longitude);
        if (distance > 88) low = mid;
        else high = mid;
      }
      return new Date((low + high) / 2);
    }

    async function calculateProfileFromBirth(form) {
      const swe = await getSwiss();
      const birthUtc = birthDateToUtc(form);
      const birthJd = dateToJulian(swe, birthUtc);
      const natalSun = swe.calculatePosition(birthJd, SE_PLANET.Sun, swissFlags());
      const designUtc = await findDesignDate(swe, birthUtc, natalSun.longitude);
      const designJd = dateToJulian(swe, designUtc);
      const activations = [];
      ["personality", "design"].forEach(kind => {
        const jd = kind === "personality" ? birthJd : designJd;
        PLANETS.forEach(planet => {
          try {
            const position = planetPositionAt(swe, jd, planet);
            activations.push(longitudeGate({ kind, planetId: planet.id, planetName: planet.name, longitude: norm(position.longitude), latitude: position.latitude, speed: position.longitudeSpeed, source: position.approximated ? "chiron-fallback" : "swiss-wasm" }));
          } catch (error) {
            activations.push({ kind, planetId: planet.id, planetName: planet.name, error: error.message, source: "missing" });
          }
        });
      });
      const definedGates = Array.from(new Set(activations.filter(a => a.gate).map(a => a.gate))).sort((a, b) => a - b);
      const definedCenters = activatedCentersFromGates(definedGates);
      const name = form.name.trim() || T(BL("Live-Profil", "Live profile"));
      return {
        id: "custom",
        name,
        placeholder: false,
        isLive: true,
        subtitle: BL("Live berechnet aus Geburtsdaten", "Live-calculated from birth data"),
        authority: derivedAuthority(definedCenters),
        strategy: derivedStrategy(definedCenters),
        definedCenters,
        definedGates,
        tone: BL("Dieses Profil wurde aus den eingegebenen Geburtsdaten berechnet. Pruefe besonders Uhrzeit und UTC-Offset.", "This profile was calculated from the entered birth data. Double-check birth time and UTC offset."),
        birthData: { birthUtc, designUtc, birthplace: form.birthplace, utcOffset: form.utcOffset },
        activations
      };
    }

    async function scoreFor(profile, date) {
      const transits = await ephemerisTransitsFor(date);
      const transitGates = new Set(transits.map(t => t.gate));
      const personal = new Set(profile.definedGates);
      const values = Object.fromEntries(Object.keys(DIMENSIONS).map(dim => [dim, 4.2]));
      const activatedChannels = [];

      transits.forEach(t => {
        const dim = GATE_INFO[t.gate].dimension;
        values[dim] += personal.has(t.gate) ? 2.1 : 1.05;
        if (!profile.definedCenters.includes(t.center)) values.clarity -= .15;
      });

      CHANNELS.forEach(channel => {
        const personalA = personal.has(channel.a), personalB = personal.has(channel.b);
        const transitA = transitGates.has(channel.a), transitB = transitGates.has(channel.b);
        const completedByTransit = (personalA && transitB) || (personalB && transitA);
        const nativeChannel = personalA && personalB;
        if (completedByTransit || nativeChannel) {
          const dimA = GATE_INFO[channel.a].dimension;
          const dimB = GATE_INFO[channel.b].dimension;
          values[dimA] += completedByTransit ? 1.4 : .45;
          values[dimB] += completedByTransit ? .9 : .35;
          activatedChannels.push({ ...channel, completedByTransit, nativeChannel });
        }
      });

      if (transitGates.has(14) || transitGates.has(45) || transitGates.has(26)) values.energy += .9;
      if (transitGates.has(57) || transitGates.has(48)) values.intuition += .9;
      if (transitGates.has(12) || transitGates.has(23) || transitGates.has(62)) values.expression += .75;
      if (transitGates.has(5) || transitGates.has(15) || transitGates.has(46)) values.flow += .75;

      Object.keys(values).forEach(dim => values[dim] = +clamp(values[dim]).toFixed(1));
      const weighted = Object.entries(values).reduce((sum, [dim, value]) => sum + value * DIMENSIONS[dim].weight, 0);
      const weight = Object.values(DIMENSIONS).reduce((sum, dim) => sum + dim.weight, 0);
      const overall = +(weighted / weight).toFixed(1);
      const abundance = (values.energy >= 7.2 && values.flow >= 6.2) || [14, 45, 26, 44, 21].some(g => transitGates.has(g) && personal.has(g));
      const source = transits.some(t => t.source === "fallback") ? "fallback" : transits.some(t => t.source === "chiron-fallback") ? "swiss-wasm + chiron-fallback" : "swiss-wasm";
      return { transits, transitGates, values, overall, activatedChannels, abundance, source };
    }

    const ringColor = score => score >= 7 ? "var(--good)" : score >= 5 ? "var(--warn)" : "var(--low)";

    function dailyReading(profile, model) {
      const sorted = Object.entries(model.values).sort((a, b) => b[1] - a[1]);
      const [topDim, topValue] = sorted[0];
      const [lowDim] = sorted[sorted.length - 1];
      const sun = model.transits.find(t => t.id === "sun");
      const moon = model.transits.find(t => t.id === "moon");
      const dayType = model.overall >= 7 ? BL("ein starker Tag", "a strong day") : model.overall >= 5 ? BL("ein gemischter, gut steuerbarer Tag", "a mixed but steerable day") : BL("ein ruhiger Tag", "a quiet day");
      const line1 = BL(`Heute ist fuer ${profile.name} ${T(dayType)}.`, `For ${profile.name}, today is ${T(dayType)}.`);
      const line2 = BL(`Am meisten traegt ${T(DIMENSIONS[topDim].label).toLowerCase()} (${topValue}/10), besonders ueber Tor ${sun.gate}: ${T(GATE_INFO[sun.gate].name)}.`, `${T(DIMENSIONS[topDim].label)} carries the day most (${topValue}/10), especially through gate ${sun.gate}: ${T(GATE_INFO[sun.gate].name)}.`);
      const line3 = model.abundance
        ? BL("Ein Abundance-Fenster ist offen: Angebot, Preis, Ressourcen oder ein konkreter naechster Schritt duerfen sichtbar werden.", "An abundance window is open: offer, price, resources, or a concrete next step can become visible.")
        : BL(`Halte ${T(DIMENSIONS[lowDim].label).toLowerCase()} leicht und vermeide Entscheidungen nur aus Druck.`, `Keep ${T(DIMENSIONS[lowDim].label).toLowerCase()} light and avoid decisions made only from pressure.`);
      const line4 = BL(`${T(MOON_NOTES[moon.gate % MOON_NOTES.length])} Praktisch: ${model.overall >= 7 ? "wichtige Gespraeche oder klare Veroeffentlichung sind moeglich" : model.overall >= 5 ? "ein fokussierter Schritt reicht" : "zurueckhalten, sortieren und Koerper-Intuition vertrauen"}.`, `${T(MOON_NOTES[moon.gate % MOON_NOTES.length])} Practically: ${model.overall >= 7 ? "important conversations or clear publishing are supported" : model.overall >= 5 ? "one focused step is enough" : "hold back, sort, and trust body intuition"}.`);
      return [line1, line2, line3, line4].map(T).join(" ");

    function activeChannelClass(channel, profile, model) {
      const personal = new Set(profile.definedGates);
      const aPersonal = personal.has(channel.a), bPersonal = personal.has(channel.b);
      const aTransit = model.transitGates.has(channel.a), bTransit = model.transitGates.has(channel.b);
      if ((aPersonal || bPersonal) && (aTransit || bTransit)) return "active-both";
      if (aPersonal && bPersonal) return "active-personal";
      if (aTransit && bTransit) return "active-transit";
      return "";
    }

      if (l.type === "rect") {
        shape = `<rect class="${cls}" data-center="${center}" x="${l.x}" y="${l.y}" width="${l.w}" height="${l.h}" rx="14"></rect>`;
      } else if (l.type === "diamond") {
        shape = `<polygon class="${cls}" data-center="${center}" points="${l.x + l.w / 2},${l.y} ${l.x + l.w},${l.y + l.h / 2} ${l.x + l.w / 2},${l.y + l.h} ${l.x},${l.y + l.h / 2}"></polygon>`;
      } else if (l.type === "triangle-right") {
        shape = `<polygon class="${cls}" data-center="${center}" points="${l.x},${l.y} ${l.x + l.w},${l.y + l.h / 2} ${l.x},${l.y + l.h}"></polygon>`;
      } else if (l.type === "triangle-left") {
        shape = `<polygon class="${cls}" data-center="${center}" points="${l.x + l.w},${l.y} ${l.x},${l.y + l.h / 2} ${l.x + l.w},${l.y + l.h}"></polygon>`;
      } else {
        shape = `<polygon class="${cls}" data-center="${center}" points="${l.x + l.w / 2},${l.y} ${l.x + l.w},${l.y + l.h} ${l.x},${l.y + l.h}"></polygon>`;
      }
      return shape + label;
    }

      const scoreLabel = model.overall >= 7 ? BL("stark", "strong") : model.overall >= 5 ? BL("steuerbar", "steerable") : BL("ruhig", "quiet");
      document.documentElement.lang = lang;
      document.getElementById("app").innerHTML = `
        <section class="hero">
          <div class="hero-card">
            <div>
              <div class="eyebrow">${T(BL("Daily Energy Map Widget", "Daily Energy Map Widget"))}</div>
              <h1>${T(BL("Live-Chart + Tagesenergie", "Live chart + daily energy"))}</h1>
              <p class="lead">${T(BL("Ein statisch hostbares Widget mit Swiss-Ephemeris-Berechnung im Browser. Demo-Profile sind klar als Platzhalter markiert; echte Nutzer koennen ihre Geburtsdaten eingeben.", "A statically hostable widget with Swiss Ephemeris calculation in the browser. Demo profiles are clearly marked as placeholders; real users can enter birth data."))}</p>
            </div>
            <div class="toolbar">
              <button id="prevDay" type="button">${T(BL("Zurueck", "Previous"))}</button>
              <button id="todayBtn" type="button">${T(BL("Heute", "Today"))}</button>
              <button id="nextDay" type="button">${T(BL("Weiter", "Next"))}</button>
              <button id="langBtn" type="button">${lang === "de" ? "EN" : "DE"}</button>
            </div>
          </div>
          <div class="hero-card score-card">
            <p class="date-line">${date.toLocaleDateString(lang === "de" ? "de-DE" : "en-US", { weekday: "long", year: "numeric", month: "long", day: "numeric" })}</p>
            <div class="score-ring" style="--score:${model.overall};--ring:${ringColor(model.overall)}">
              <strong>${model.overall}</strong>
            </div>
            <p class="date-line">${T(BL("Gesamtscore", "Overall score"))}: ${T(scoreLabel)} ${model.abundance ? "· " + T(BL("Abundance-Fenster offen", "abundance window open")) : ""}</p>
            <div class="metric-row">
              <span class="metric"><strong>${model.transits.length}</strong> ${T(BL("Planeten", "planets"))}</span>
              <span class="metric"><strong>${model.transitGates.size}</strong> ${T(BL("Transit-Gates", "transit gates"))}</span>
              <span class="metric"><strong>${model.activatedChannels.length}</strong> ${T(BL("Kanaele", "channels"))}</span>
              <span class="metric"><strong>${model.source}</strong> ${T(BL("Ephemeris", "ephemeris"))}</span>
            </div>
          </div>
        </section>

        <section class="grid">
          <div>
            ${renderBirthForm()}
            ${renderProfilePanel(profile, model)}
          </div>
          <section class="panel bodygraph-wrap">
            <h2>${T(BL("Live Bodygraph", "Live bodygraph"))}</h2>
            ${renderBodygraph(profile, model)}
            <div class="chips">
              <span class="chip">${T(BL("Violett: definiert", "Purple: defined"))}</span>
              <span class="chip">${T(BL("Gruen: Transit", "Green: transit"))}</span>
              <span class="chip">${T(BL("Gold: beides", "Gold: both"))}</span>
            </div>
            <div class="detail-box" id="detailBox"><strong>${T(BL("Klicke ein Tor oder Zentrum.", "Click a gate or center."))}</strong><br>${T(profile.tone)}</div>
            <h2>${T(BL("6 Dimensionen", "6 dimensions"))}</h2>
            ${renderScores(model)}
          </section>
          <div>
            ${renderTransitPanel(model)}
            ${renderPenta(date)}
          </div>
        </section>
        <p class="footer">${T(BL("Widget-faehig: statischer Build, keine eigene Serverlogik. Swiss Ephemeris WASM berechnet im Browser; Chiron ist markiert approximiert, falls keine Asteroiden-Ephemeris verfuegbar ist.", "Widget-ready: static build, no custom server logic. Swiss Ephemeris WASM calculates in the browser; Chiron is marked as approximated if no asteroid ephemeris is available."))}</p>
      `;

      bindEvents(profile, model);
      isRendering = false;
      if (renderAgain) renderApp();
    }

    function bindEvents(profile, model) {
      document.getElementById("prevDay").addEventListener("click", () => { dayIndex -= 1; renderApp(); });
      document.getElementById("nextDay").addEventListener("click", () => { dayIndex += 1; renderApp(); });
      document.getElementById("todayBtn").addEventListener("click", () => { dayIndex = 0; renderApp(); });
      document.getElementById("langBtn").addEventListener("click", () => { lang = lang === "de" ? "en" : "de"; renderApp(); });
      ["birthName", "birthDate", "birthTime", "utcOffset", "birthplace"].forEach(id => {
        const node = document.getElementById(id);
        if (node) node.addEventListener("input", event => {
          const key = { birthName: "name", birthDate: "date", birthTime: "time", utcOffset: "utcOffset", birthplace: "birthplace" }[id];
          birthForm[key] = event.target.value;
        });
      });
      document.getElementById("calculateBirth").addEventListener("click", async () => {
        try {
          renderLoading(T(BL("Geburtschart wird mit Swiss Ephemeris berechnet.", "Birth chart is being calculated with Swiss Ephemeris.")));
          customProfile = await calculateProfileFromBirth(birthForm);
          activeProfile = "custom";
          await renderApp();
        } catch (error) {
          ephemerisInfo = BL(`Eingabe konnte nicht berechnet werden: ${error.message}`, `Input could not be calculated: ${error.message}`);
          await renderApp();
        }
      });
      document.getElementById("profileSelect").addEventListener("change", event => { activeProfile = event.target.value; renderApp(); });
      document.querySelectorAll("[data-gate]").forEach(node => node.addEventListener("click", () => {
        document.getElementById("detailBox").innerHTML = detailForGate(profile, model, Number(node.dataset.gate));
      }));
      document.querySelectorAll("[data-center]").forEach(node => node.addEventListener("click", () => {
        const center = node.dataset.center;
        const defined = profile.definedCenters.includes(center);
        const profileNote = (PROFILE_CENTER_NOTES[profile.id] && PROFILE_CENTER_NOTES[profile.id][center]) || CENTER_DESCRIPTIONS[center];
        document.getElementById("detailBox").innerHTML = `<strong>${T(CENTER_LABELS[center])}</strong><br>${T(profileNote)}<br><span>${defined ? T(BL("Bei diesem Profil definiert.", "Defined in this profile.")) : T(OPEN_CENTER_WARNINGS[center])}</span>`;
      }));
      document.querySelectorAll("[data-member]").forEach(node => node.addEventListener("change", event => {
        pentaOn[event.target.dataset.member] = event.target.checked;
        renderApp();
      }));
    }

    renderApp();
  </script>
</body>
</html>
