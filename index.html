<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Human Design for everyday life — your chart in normal language. Readings from Samadhi · Paradise Ventures.">
  <title>Human Design · Samadhi</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Hanken+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink: #0E1320; --ink-2: #161D2E; --line: #2A3550; --bone: #ECE6D6;
      --muted: #8C97AE; --gold: #C9A24B; --jade: #4FB39A; --rust: #B5543A;
      --display: "Fraunces", Georgia, serif;
      --body: "Hanken Grotesk", system-ui, sans-serif;
      --mono: "IBM Plex Mono", ui-monospace, monospace;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body { background: var(--ink); color: var(--bone); font-family: var(--body); font-size: 17px; line-height: 1.6; -webkit-font-smoothing: antialiased; }
    .wrap { max-width: 1080px; margin: 0 auto; padding: 0 28px; }
    a { color: inherit; text-decoration: none; }
    section { padding: 88px 0; border-top: 1px solid var(--line); }
    .eyebrow { font-family: var(--mono); font-size: 11.5px; letter-spacing: .22em; text-transform: uppercase; color: var(--gold); display: block; }
    h2.section-title { font-family: var(--display); font-weight: 500; font-size: clamp(28px, 4.4vw, 46px); line-height: 1.08; letter-spacing: -.01em; margin: 14px 0 0; max-width: 22ch; }
    .lede { font-size: clamp(17px, 2vw, 20px); color: #C8CEDC; max-width: 62ch; margin-top: 18px; }
    .topnav { position: fixed; top: 0; left: 0; right: 0; z-index: 100; background: rgba(14, 19, 32, .88); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
    .topnav .wrap { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-top: 14px; padding-bottom: 14px; }
    .brand { font-family: var(--display); font-weight: 600; font-size: 1.05rem; }
    .nav-links { display: flex; gap: 18px; font-family: var(--mono); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
    .nav-links a:hover { color: var(--jade); }
    .nav-actions { display: flex; align-items: center; gap: 10px; }
    .lang-btn { font-family: var(--body); font-size: 14px; font-weight: 600; letter-spacing: .02em; border: 1px solid var(--line); background: rgba(255,255,255,.04); color: var(--bone); padding: 10px 18px; border-radius: 999px; cursor: pointer; white-space: nowrap; }
    .lang-btn:hover { border-color: var(--jade); color: var(--jade); background: rgba(79,179,154,.08); }
    .nav-cta { font-family: var(--mono); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; border: 1px solid rgba(201, 162, 75, .45); color: var(--gold); padding: 8px 14px; border-radius: 999px; white-space: nowrap; }
    .nav-cta:hover { background: rgba(201, 162, 75, .12); }
    .hero { min-height: 100svh; display: flex; align-items: center; padding: 120px 0 80px; border-top: none; position: relative; overflow: hidden; }
    .orbit-field { position: absolute; inset: 0; pointer-events: none; opacity: .5; }
    .hero-grid { position: relative; z-index: 2; display: grid; grid-template-columns: 1.45fr 1fr; gap: 48px; align-items: center; width: 100%; }
    .hero h1 { font-family: var(--display); font-weight: 600; font-size: clamp(42px, 7vw, 78px); line-height: .98; letter-spacing: -.025em; margin: 18px 0 0; }
    .hero h1 em { color: var(--jade); font-style: italic; font-weight: 500; }
    .hero-tagline { font-family: var(--display); font-style: italic; font-size: clamp(19px, 2.6vw, 28px); line-height: 1.3; margin: 24px 0 0; max-width: 24ch; }
    .hero-sub { color: var(--muted); max-width: 48ch; margin-top: 20px; font-size: 16px; }
    .hero-actions { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 32px; }
    .btn-primary { font-family: var(--mono); font-size: 12px; letter-spacing: .12em; text-transform: uppercase; background: var(--jade); color: var(--ink); border: none; padding: 14px 22px; border-radius: 999px; font-weight: 600; cursor: pointer; display: inline-block; transition: transform .2s, box-shadow .2s; }
    .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 28px rgba(79, 179, 154, .25); }
    .btn-wa { background: #25D366; color: #0E1320; }
    .btn-wa:hover { box-shadow: 0 8px 28px rgba(37, 211, 102, .25); }
    .btn-ghost { font-family: var(--mono); font-size: 12px; letter-spacing: .1em; text-transform: uppercase; border: 1px solid var(--line); color: var(--bone); padding: 14px 22px; border-radius: 999px; background: transparent; display: inline-block; }
    .btn-ghost:hover { border-color: var(--jade); color: var(--jade); }
    .transit { background: rgba(22, 29, 46, .75); border: 1px solid var(--line); border-radius: 14px; padding: 22px; backdrop-filter: blur(6px); }
    .transit .t-label { font-family: var(--mono); font-size: 10.5px; letter-spacing: .2em; text-transform: uppercase; color: var(--muted); }
    .transit-quote { font-family: var(--display); font-size: 20px; line-height: 1.35; margin-top: 14px; }
    .transit-quote b { color: var(--gold); font-weight: 500; }
    .transit-note { font-size: 14px; color: var(--muted); margin-top: 14px; line-height: 1.5; border-top: 1px dashed var(--line); padding-top: 14px; }
    .promise-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-top: 46px; }
    .promise { border: 1px solid var(--line); border-radius: 14px; padding: 26px; background: var(--ink-2); }
    .promise h3 { font-family: var(--display); font-size: 20px; font-weight: 500; margin-bottom: 10px; color: var(--jade); }
    .promise p { font-size: 15px; color: #C8CEDC; line-height: 1.55; }
    .duo { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; margin-top: 48px; }
    .card-sys { border: 1px solid var(--line); border-radius: 16px; padding: 28px; background: var(--ink-2); }
    .card-sys.kreislauf { border-color: rgba(79, 179, 154, .4); }
    .card-sys.pendel { border-color: rgba(181, 84, 58, .4); }
    .card-sys h3 { font-family: var(--display); font-size: 24px; font-weight: 500; }
    .kreislauf h3 { color: var(--jade); }
    .pendel h3 { color: var(--rust); }
    .card-sys p { font-size: 15px; color: #C8CEDC; margin-top: 12px; line-height: 1.55; }
    .standing { margin-top: 34px; border-left: 2px solid var(--gold); padding: 6px 0 6px 22px; font-family: var(--display); font-style: italic; font-size: clamp(18px, 2.4vw, 24px); line-height: 1.35; max-width: 52ch; }
    .type-teaser { background: linear-gradient(180deg, rgba(22, 29, 46, .35), transparent); }
    .type-teaser-card { margin-top: 40px; border: 1px solid var(--line); border-radius: 16px; overflow: hidden; background: var(--ink-2); }
    .type-teaser-head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 10px; padding: 18px 22px; background: linear-gradient(135deg, #3D5570, #2E4258); border-bottom: 1px solid var(--line); }
    .type-teaser-head .type-name { font-family: var(--display); font-size: 1.45rem; font-weight: 600; }
    .type-teaser-head .type-meta { font-family: var(--mono); font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase; color: rgba(236, 230, 214, .75); }
    .type-teaser-body { padding: 22px; }
    .type-key { font-size: 14px; color: #C8CEDC; border-left: 2px solid var(--gold); padding-left: 14px; margin-bottom: 20px; line-height: 1.5; }
    .type-key .in-label { color: #7EB8D4; font-weight: 600; }
    .type-key .out-label { color: var(--gold); font-weight: 600; }
    .type-duo { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; margin-bottom: 22px; }
    .type-duo h4 { font-family: var(--mono); font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; }
    .type-duo p { font-size: 14.5px; color: #C8CEDC; line-height: 1.5; }
    .type-gauge-label { font-family: var(--mono); font-size: 10px; letter-spacing: .12em; text-transform: uppercase; margin: 18px 0 8px; }
    .type-gauge-label.grow { color: var(--jade); }
    .type-gauge-label.warn { color: var(--rust); }
    .type-stages { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0; border-radius: 10px; overflow: hidden; border: 1px solid var(--line); }
    .type-stages .st { padding: 10px 8px; font-size: 11.5px; line-height: 1.35; border-right: 1px solid var(--line); }
    .type-stages .st:last-child { border-right: none; }
    .type-stages .st b { display: block; font-family: var(--mono); font-size: 8.5px; letter-spacing: .06em; text-transform: uppercase; margin-bottom: 4px; opacity: .85; }
    .type-stages.grow .st { background: rgba(79, 179, 154, .08); }
    .type-stages.grow .st b { color: var(--jade); }
    .type-stages.warn .st { background: rgba(181, 84, 58, .08); }
    .type-stages.warn .st b { color: var(--rust); }
    .type-stages.warn .st:first-child { background: rgba(181, 84, 58, .18); border: 1px solid rgba(181, 84, 58, .35); }
    .type-group { margin-top: 20px; padding: 16px 18px; border-radius: 12px; background: rgba(14, 19, 32, .6); border: 1px dashed rgba(201, 162, 75, .35); }
    .type-group h4 { font-family: var(--mono); font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: var(--gold); margin-bottom: 8px; }
    .type-group p { font-size: 14px; color: #C8CEDC; line-height: 1.5; margin: 0; }
    .type-teaser-foot { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 14px; margin-top: 22px; padding-top: 18px; border-top: 1px solid rgba(255,255,255,.06); }
    .type-teaser-foot p { font-size: 14px; color: var(--muted); margin: 0; max-width: 52ch; }
    .type-teaser-link { font-family: var(--mono); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--jade); white-space: nowrap; }
    .type-teaser-link:hover { color: var(--gold); }
    .pricing { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-top: 46px; }
    .price-card { border: 1px solid var(--line); border-radius: 16px; padding: 28px; background: var(--ink-2); display: flex; flex-direction: column; }
    .price-card.featured { border-color: rgba(201, 162, 75, .45); background: linear-gradient(160deg, #1A2336, #141B2B); }
    .price-kicker { font-family: var(--mono); font-size: 10.5px; letter-spacing: .18em; text-transform: uppercase; color: var(--gold); }
    .price-card h3 { font-family: var(--display); font-size: 26px; font-weight: 500; margin: 8px 0 4px; }
    .price-amount { font-family: var(--display); font-size: 36px; color: var(--jade); margin: 12px 0; }
    .price-amount span { font-size: 16px; color: var(--muted); font-family: var(--body); }
    .price-card ul { list-style: none; flex: 1; margin: 16px 0 24px; }
    .price-card li { font-size: 14.5px; color: #C8CEDC; padding: 8px 0 8px 16px; position: relative; line-height: 1.45; border-top: 1px solid rgba(255,255,255,.05); }
    .price-card li:first-child { border-top: none; }
    .price-card li::before { content: ""; position: absolute; left: 0; top: 15px; width: 5px; height: 5px; border-radius: 50%; background: var(--jade); }
    .pay-box { margin-top: 28px; border: 1px solid rgba(201, 162, 75, .25); border-radius: 14px; padding: 22px; background: rgba(201, 162, 75, .04); }
    .pay-box h4 { font-family: var(--display); font-size: 18px; margin-bottom: 8px; }
    .pay-box p { font-size: 15px; color: #C8CEDC; line-height: 1.55; }
    .pay-tags { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
    .pay-tag { font-family: var(--mono); font-size: 11px; letter-spacing: .08em; border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; color: var(--muted); }
    .about-grid { display: grid; grid-template-columns: 1.2fr .8fr; gap: 32px; margin-top: 46px; align-items: start; }
    .about-panel { border: 1px solid var(--line); border-radius: 16px; padding: 28px; background: var(--ink-2); }
    .about-panel h3 { font-family: var(--display); font-size: 22px; font-weight: 500; margin-bottom: 12px; }
    .about-panel p, .about-panel li { font-size: 15px; color: #C8CEDC; line-height: 1.55; }
    .about-panel ul { list-style: none; margin-top: 12px; }
    .about-panel li { padding: 6px 0 6px 16px; position: relative; }
    .about-panel li::before { content: ""; position: absolute; left: 0; top: 13px; width: 5px; height: 5px; border-radius: 50%; background: var(--gold); }
    .mech { padding: 14px 0; border-top: 1px solid rgba(255,255,255,.06); }
    .mech:first-child { border-top: none; padding-top: 0; }
    .mech .m-h { font-family: var(--display); font-size: 17px; font-weight: 500; }
    .mech .m-h span { font-family: var(--mono); font-size: 10px; color: var(--jade); letter-spacing: .1em; margin-left: 6px; }
    .mech p { font-size: 14px; color: var(--muted); margin-top: 5px; }
    .journey-steps { display: grid; grid-template-columns: repeat(2, 1fr); gap: 18px; margin-top: 40px; }
    .step { border: 1px solid var(--line); border-radius: 14px; padding: 22px; background: var(--ink-2); }
    .step .num { font-family: var(--mono); font-size: 11px; color: var(--gold); letter-spacing: .15em; }
    .step h3 { font-family: var(--display); font-size: 19px; margin: 6px 0 8px; }
    .step p { font-size: 14.5px; color: #C8CEDC; line-height: 1.5; }
    .close { text-align: center; padding: 100px 0 80px; }
    .close blockquote { font-family: var(--display); font-weight: 500; font-size: clamp(26px, 4.6vw, 42px); line-height: 1.18; max-width: 24ch; margin: 20px auto 0; }
    .close blockquote em { color: var(--jade); font-style: italic; }
    .close .sub { color: var(--muted); margin-top: 18px; font-size: 17px; max-width: 50ch; margin-left: auto; margin-right: auto; }
    .wa-line { font-family: var(--mono); font-size: 14px; color: var(--jade); margin-top: 16px; letter-spacing: .04em; }
    footer { border-top: 1px solid var(--line); padding: 30px 0; text-align: center; font-family: var(--mono); font-size: 11.5px; color: var(--muted); letter-spacing: .1em; }
    footer a { color: var(--jade); }
    @media (max-width: 860px) {
      .hero-grid, .duo, .promise-grid, .pricing, .about-grid, .journey-steps, .type-duo { grid-template-columns: 1fr; }
      .type-stages { grid-template-columns: 1fr 1fr; }
      .nav-links { display: none; }
      section { padding: 64px 0; }
    }
  </style>
</head>

<nav class="topnav" aria-label="Main">
  <div class="wrap">
    <a class="brand" href="#">Samadhi</a>
    <div class="nav-links">
      <a href="#how" data-i18n="nav.how"></a>
      <a href="#lens" data-i18n="nav.lens"></a>
      <a href="#offer" data-i18n="nav.offer"></a>
      <a href="#about" data-i18n="nav.about"></a>
    </div>
    <div class="nav-actions">
      <button type="button" class="lang-btn" id="langBtn" aria-label="Sprache wechseln">English</button>
    </div>
  </div>
</nav>

<header class="hero">
  <svg class="orbit-field" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
    <g fill="none" stroke="#2A3550" stroke-width="1">
      <circle cx="980" cy="200" r="120"/><circle cx="980" cy="200" r="210"/>
      <circle cx="980" cy="200" r="320"/><circle cx="980" cy="200" r="440"/>
    </g>
    <circle cx="980" cy="80" r="3.5" fill="#C9A24B"/><circle cx="770" cy="200" r="3" fill="#4FB39A"/>
  </svg>
  <div class="wrap">
    <div class="hero-grid">
      <div>
        <span class="eyebrow" data-i18n="hero.eyebrow"></span>
        <h1 data-i18n-html="hero.title"></h1>
        <p class="hero-tagline" data-i18n="hero.tagline"></p>
        <p class="hero-sub" data-i18n="hero.sub"></p>
        <div class="hero-actions">
          <a class="btn-primary btn-wa" id="waHero" href="#" data-i18n="cta.whatsapp"></a>
          <a class="btn-ghost" href="app/" data-i18n="cta.freeMap"></a>

      <aside class="transit">
        <span class="t-label" data-i18n="hero.boxLabel"></span>

        <p class="transit-note" data-i18n="hero.boxNote"></p>
      </aside>
    </div>
  </div>
</header>

<section id="how">
  <div class="wrap">
    <span class="eyebrow" data-i18n="how.eyebrow"></span>
    <h2 class="section-title" data-i18n="how.title"></h2>
    <p class="lede" data-i18n="how.lede"></p>
    <div class="promise-grid">
      <div class="promise"><h3 data-i18n="how.p1t"></h3><p data-i18n="how.p1b"></p></div>
      <div class="promise"><h3 data-i18n="how.p2t"></h3><p data-i18n="how.p2b"></p></div>
      <div class="promise"><h3 data-i18n="how.p3t"></h3><p data-i18n="how.p3b"></p></div>
    </div>
    <div class="journey-steps">
      <div class="step"><span class="num" data-i18n="how.s1n"></span><h3 data-i18n="how.s1t"></h3><p data-i18n="how.s1b"></p></div>
      <div class="step"><span class="num" data-i18n="how.s2n"></span><h3 data-i18n="how.s2t"></h3><p data-i18n="how.s2b"></p></div>
      <div class="step"><span class="num" data-i18n="how.s3n"></span><h3 data-i18n="how.s3t"></h3><p data-i18n="how.s3b"></p></div>
      <div class="step"><span class="num" data-i18n="how.s4n"></span><h3 data-i18n="how.s4t"></h3><p data-i18n="how.s4b"></p></div>
    </div>
  </div>
</section>

<section id="lens">
  <div class="wrap">
    <span class="eyebrow" data-i18n="lens.eyebrow"></span>
    <h2 class="section-title" data-i18n="lens.title"></h2>
    <p class="lede" data-i18n="lens.lede"></p>
    <div class="duo">
      <div class="card-sys kreislauf"><h3 data-i18n="lens.cycleT"></h3><p data-i18n="lens.cycleB"></p></div>
      <div class="card-sys pendel"><h3 data-i18n="lens.pendT"></h3><p data-i18n="lens.pendB"></p></div>
    </div>
    <p class="standing" data-i18n="lens.standing"></p>
  </div>
</section>

<section id="type-teaser" class="type-teaser">
  <div class="wrap">
    <span class="eyebrow" data-i18n="type.eyebrow"></span>
    <h2 class="section-title" data-i18n="type.title"></h2>
    <p class="lede" data-i18n="type.lede"></p>

    <div class="type-teaser-card" role="region" aria-labelledby="type-teaser-heading">
      <div class="type-teaser-head">
        <span class="type-name" id="type-teaser-heading" data-i18n="type.proName"></span>
        <span class="type-meta" data-i18n="type.proMeta"></span>
      </div>
      <div class="type-teaser-body">
        <p class="type-key" data-i18n-html="type.key"></p>
        <div class="type-duo">
          <div>
            <h4 data-i18n="type.inLabel"></h4>
            <p data-i18n="type.proIn"></p>
          </div>
          <div>
            <h4 data-i18n="type.outLabel"></h4>
            <p data-i18n="type.proOut"></p>
          </div>
        </div>

        <p class="type-gauge-label grow" data-i18n="type.growLabel"></p>
        <div class="type-stages grow" aria-label="Growth stages">
          <div class="st"><b data-i18n="type.g1b"></b><span data-i18n="type.g1t"></span></div>
          <div class="st"><b data-i18n="type.g2b"></b><span data-i18n="type.g2t"></span></div>
          <div class="st"><b data-i18n="type.g3b"></b><span data-i18n="type.g3t"></span></div>
          <div class="st"><b data-i18n="type.g4b"></b><span data-i18n="type.g4t"></span></div>
        </div>

        <p class="type-gauge-label warn" data-i18n="type.warnLabel"></p>
        <div class="type-stages warn" aria-label="Warning stages">
          <div class="st"><b data-i18n="type.w1b"></b><span data-i18n="type.w1t"></span></div>
          <div class="st"><b data-i18n="type.w2b"></b><span data-i18n="type.w2t"></span></div>
          <div class="st"><b data-i18n="type.w3b"></b><span data-i18n="type.w3t"></span></div>
          <div class="st"><b data-i18n="type.w4b"></b><span data-i18n="type.w4t"></span></div>
        </div>

        <div class="type-group">
          <h4 data-i18n="type.groupLabel"></h4>
          <p data-i18n="type.groupBody"></p>
        </div>

        <div class="type-teaser-foot">
          <p data-i18n="type.foot"></p>
          <a class="type-teaser-link" href="wissen/typ-erkennung/" data-i18n="type.link"></a>
        </div>
      </div>
    </div>
  </div>
</section>

<section id="offer">
  <div class="wrap">
    <span class="eyebrow" data-i18n="offer.eyebrow"></span>
    <h2 class="section-title" data-i18n="offer.title"></h2>
    <p class="lede" data-i18n="offer.lede"></p>
    <div class="pricing">
