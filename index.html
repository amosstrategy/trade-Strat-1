              <span class="chip">${T(BL("Tuerkis: Transit", "Teal: transit"))}</span>
              <span class="chip">${T(BL("Beide Haelften: Chart + Transit", "Both halves: chart + transit"))}</span>`
        : `<span class="chip">${T(BL("Violett: Persoenlichkeit", "Purple: personality"))}</span>
              <span class="chip">${T(BL("Tuerkis: Design", "Teal: design"))}</span>
              <span class="chip">${T(BL("Kanaele: dein festes Design", "Channels: your fixed design"))}</span>`;
      document.documentElement.lang = lang;

      const dailyView = `
        <section class="hero compact-top">
          <div class="hero-card compact-top-card">
            <div class="hero-top-row">
              <div class="hero-copy">
                <div class="eyebrow">${T(BL("Daily Energy Map", "Daily Energy Map"))}</div>
                <h1>${T(BL("Wann ist der beste Moment fuer was?", "When is the best moment for what?"))}</h1>
                <p class="lead">${T(BL("Score links, Chart Mitte, Tages-Fokus rechts — Bereich anklicken fuer Filter.", "Score left, chart center, day focus right — click a field to filter."))}</p>
              </div>
            </div>
          </div>
        </section>
        ${renderDateBar(date)}
        ${renderDayOverviewStrip(profile, day, model)}
        <section class="map-grid">
          <div class="map-sidebar-col">
            ${renderProfileStrip(profile, day, date)}
            ${renderScoreSidebar(model, baseline, showTransits, profile)}
          </div>
          <section class="panel bodygraph-wrap">
            <h2>${showTransits ? T(BL("Live Bodygraph", "Live bodygraph")) : T(BL("Dein Bodygraph", "Your bodygraph"))}</h2>
            ${renderBodygraph()}
            <div class="chips">${bodygraphChips}</div>
            <div class="detail-box" id="detailBox"><strong>${T(BL("Klicke ein Tor oder Zentrum.", "Click a gate or center."))}</strong><br>${T(profile.tone)}</div>
          </section>
          ${renderUnifiedFocusPanel(profile, day, model)}
        </section>
        ${renderProfileExtras(profile, day, date)}`;

      const pentaView = `
        ${renderDateBar(date)}
        <section class="grid" style="grid-template-columns:1fr">
          ${renderPentaPage(date)}
        </section>`;

      const inputView = renderInputTab();
      const adminView = activeTab === "admin" ? renderAdminTab() : "";

      const heuteView = renderHeuteView(profile, date);

      document.getElementById("app").innerHTML = `
        ${renderTabs()}
        <div class="tab-panel ${activeTab === "daily" ? "" : "hidden"}">${dailyView}</div>
        <div class="tab-panel ${activeTab === "heute" ? "" : "hidden"}">${heuteView}</div>
        <div class="tab-panel ${activeTab === "penta" ? "" : "hidden"}">${pentaView}</div>
        <div class="tab-panel ${activeTab === "input" ? "" : "hidden"}">${inputView}</div>
        <div class="tab-panel ${activeTab === "admin" ? "" : "hidden"}">${adminView}</div>
        <p class="footer">${T(BL("Profil-Datenbank v2 (hd-profile-db-v2) · Engine v4 · Chart nur bei «Berechnen & Speichern».", "Profile database v2 (hd-profile-db-v2) · Engine v4 · Chart only on «Calculate & save»."))}</p>
      `;

      bindEvents(profile, day);
      if (activeTab === "daily") mountBodygraph(day);
    }

    function bindEvents(profile, day) {
      const model = day.display;
      document.querySelectorAll("[data-tab]").forEach(btn => btn.addEventListener("click", () => {
        activeTab = btn.dataset.tab;
        renderApp();
      }));
      document.querySelectorAll("[data-zeit-scope]").forEach(btn => btn.addEventListener("click", () => {
        zeitScope = btn.dataset.zeitScope;
        renderApp();
      }));
      document.querySelectorAll("[data-zeit-hd-type]").forEach(btn => btn.addEventListener("click", () => {
        zeitHdType = btn.dataset.zeitHdType || "";
        renderApp();
      }));
      const langBtn = document.getElementById("langBtn");
      if (langBtn) langBtn.addEventListener("click", () => { lang = lang === "de" ? "en" : "de"; renderApp(); });

      const transitToggleBtn = document.getElementById("transitToggleBtn");
      if (transitToggleBtn) transitToggleBtn.addEventListener("click", () => { showTransits = !showTransits; renderApp(); });

      document.querySelectorAll(".dimension-select").forEach(btn => {
        btn.addEventListener("click", () => {
          const dim = btn.dataset.dimension;
          selectedDimension = selectedDimension === dim ? null : dim;
          renderApp();
        });
      });
      const clearDimFilter = document.getElementById("clearDimFilter");
      if (clearDimFilter) clearDimFilter.addEventListener("click", () => { selectedDimension = null; renderApp(); });

      const syncFocusDimensionNested = details => {
        if (!details.open) return;
        details.querySelectorAll("details").forEach(nested => { nested.open = true; });
      };
      document.querySelectorAll(".focus-dimension").forEach(details => {
        syncFocusDimensionNested(details);
        details.addEventListener("toggle", () => syncFocusDimensionNested(details));
      });

      const onDateChange = value => {
        if (!value) return;
        selectedDateISO = value;
        renderApp();
      };
      document.querySelectorAll("#datePicker, #profileDatePicker").forEach(node => {
        node.addEventListener("change", e => onDateChange(e.target.value));
      });
      const prevBtn = document.getElementById("prevDay");
      const nextBtn = document.getElementById("nextDay");
      const todayBtn = document.getElementById("todayBtn");
      if (prevBtn) prevBtn.addEventListener("click", () => { shiftSelectedDate(-1); renderApp(); });
      if (nextBtn) nextBtn.addEventListener("click", () => { shiftSelectedDate(1); renderApp(); });
      if (todayBtn) todayBtn.addEventListener("click", () => { selectedDateISO = isoDate(today()); renderApp(); });

      const profileSelect = document.getElementById("profileSelect");
      if (profileSelect) profileSelect.addEventListener("change", e => { activeProfile = e.target.value; renderApp(); });

      document.querySelectorAll("[data-member]").forEach(node => node.addEventListener("change", event => {
        pentaOn[event.target.dataset.member] = event.target.checked;
        savePentaOn();
        renderApp();
      }));

      const adminPanel = document.getElementById("adminPanel");
      if (adminPanel) {
        adminPanel.addEventListener("click", event => {
          const editBtn = event.target.closest("[data-admin-edit]");
          if (editBtn) {
            adminEditingId = editBtn.dataset.adminEdit;
            renderApp();
            return;
          }
          const cancelBtn = event.target.closest("[data-admin-cancel-edit]");
          if (cancelBtn) {
            adminEditingId = null;
            renderApp();
            return;
          }
          const openBtn = event.target.closest("[data-admin-open]");
          if (openBtn) {
            activeProfile = openBtn.dataset.adminOpen;
            adminEditingId = null;
            activeTab = "input";
            renderApp();
            return;
          }
          const clearBtn = event.target.closest("[data-admin-clear]");
          if (clearBtn) {
            const id = clearBtn.dataset.adminClear;
            if (!confirm(T(BL(`Geburtsdaten und Chart von «${id}» loeschen?`, `Delete birth data and chart for «${id}»?`)))) return;
            ProfileStore.clearPerson(id, PROFILES);
            if (activeProfile === id) adminEditingId = null;
            renderApp();
            return;
          }
          const deleteBtn = event.target.closest("[data-admin-delete]");
          if (deleteBtn) {
            const id = deleteBtn.dataset.adminDelete;
            if (!confirm(T(BL(`Profil «${id}» endgueltig loeschen?`, `Permanently delete profile «${id}»?`)))) return;
            ProfileStore.clearPerson(id, PROFILES);
            if (activeProfile === id) activeProfile = "daniel";
            adminEditingId = null;
            renderApp();
            return;
          }
          const cacheDelBtn = event.target.closest("[data-admin-cache-delete]");
          if (cacheDelBtn) {
            const date = cacheDelBtn.dataset.adminCacheDelete;
            const cache = loadTransitCache();
            delete cache[date];
            saveTransitCache(cache);
            renderApp();
            return;
          }
        });

        adminPanel.addEventListener("submit", event => {
          const form = event.target.closest("[data-admin-save]");
          if (!form) return;
          event.preventDefault();
          const id = form.dataset.adminSave;
          const name = form.querySelector('[name="name"]').value.trim();
          const toneText = form.querySelector('[name="tone"]').value.trim();
          ProfileStore.updateMeta?.(id, { name, tone: BL(toneText, toneText) }) || ProfileStore.savePerson(id, {
            birth: ProfileStore.getRecord(id, PROFILES).birth,
            chart: ProfileStore.getRecord(id, PROFILES).chart,
            name,
            tone: BL(toneText, toneText)
          });
          adminEditingId = null;
          renderApp();
        });

        adminPanel.addEventListener("change", event => {
          const pentaInput = event.target.closest("[data-admin-penta]");
          if (pentaInput) {
            pentaOn[pentaInput.dataset.adminPenta] = pentaInput.checked;
            savePentaOn();
          }
        });

        const adminClearTransit = document.getElementById("adminClearTransitCache");
        if (adminClearTransit) adminClearTransit.addEventListener("click", () => {
          if (!confirm(T(BL("Gesamten Transit-Cache loeschen?", "Delete entire transit cache?")))) return;
          localStorage.removeItem(STORAGE_KEYS.transits);
          renderApp();
        });

        const adminExportConcordance = document.getElementById("adminExportConcordance");
        if (adminExportConcordance) adminExportConcordance.addEventListener("click", () => {
          const payload = {
            version: CONCORDANCE_STORE_VERSION,
            exported_at: new Date().toISOString(),
            records: concordanceExportArray()
          };
          const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
          const url = URL.createObjectURL(blob);
          const a = document.createElement("a");
          a.href = url;
          a.download = `hd-concordance-${isoDate(today())}.json`;
          a.click();
          URL.revokeObjectURL(url);
        });

        const adminClearConcordance = document.getElementById("adminClearConcordance");
        if (adminClearConcordance) adminClearConcordance.addEventListener("click", () => {
          if (!confirm(T(BL("Konkordanz-Datensatz loeschen?", "Delete concordance dataset?")))) return;
          localStorage.removeItem(STORAGE_KEYS.concordance);
          renderApp();
        });

        const adminExportDb = document.getElementById("adminExportDb");
        if (adminExportDb) adminExportDb.addEventListener("click", () => {
          const snapshot = ProfileStore.getDbSnapshot?.() || loadJSON(STORAGE_KEYS.profileDb, {});
          const blob = new Blob([JSON.stringify(snapshot, null, 2)], { type: "application/json" });
          const url = URL.createObjectURL(blob);
          const a = document.createElement("a");
          a.href = url;
          a.download = `hd-profile-db-${isoDate(today())}.json`;
          a.click();
          URL.revokeObjectURL(url);
        });

        const adminImportBtn = document.getElementById("adminImportBtn");
        const adminImportDb = document.getElementById("adminImportDb");
        if (adminImportBtn && adminImportDb) adminImportBtn.addEventListener("click", () => adminImportDb.click());
        if (adminImportDb) adminImportDb.addEventListener("change", async event => {
          const file = event.target.files?.[0];
          if (!file) return;
          try {
            const text = await file.text();
            const data = JSON.parse(text);
            if (!(ProfileStore.importDb?.(data) ?? (saveJSON(STORAGE_KEYS.profileDb, data), true))) throw new Error("invalid");
            if (!confirm(T(BL("Import erfolgreich. Seite neu laden?", "Import successful. Reload view?")))) return;
            adminEditingId = null;
            renderApp();
          } catch {
            alert(T(BL("Import fehlgeschlagen — ungueltige JSON-Datei.", "Import failed — invalid JSON file.")));
          }
          event.target.value = "";
        });

        const adminResetAll = document.getElementById("adminResetAll");
        if (adminResetAll) adminResetAll.addEventListener("click", () => {
          if (!confirm(T(BL("Wirklich ALLE App-Daten in diesem Browser loeschen?", "Really delete ALL app data in this browser?")))) return;
          Object.keys(ProfileStore.getDbSnapshot?.() || loadJSON(STORAGE_KEYS.profileDb, {})).forEach(id => ProfileStore.clearPerson(id, PROFILES));
          localStorage.removeItem(STORAGE_KEYS.transits);
          localStorage.removeItem(STORAGE_KEYS.concordance);
          localStorage.removeItem(STORAGE_KEYS.penta);
          Object.keys(pentaOn).forEach(k => delete pentaOn[k]);
          Object.assign(pentaOn, { daniel: true, patrick: true, paradise: true });
          savePentaOn();
          activeProfile = "daniel";
          adminEditingId = null;
          renderApp();
        });
      }

      const readBirthMeta = () => ({
        birthDate: document.getElementById("inputBirthDate")?.value,
        birthTime: document.getElementById("inputBirthTime")?.value,
        birthPlace: document.getElementById("inputBirthPlace")?.value.trim() || "",
        tzOffsetMinutes: Number(document.getElementById("inputTzOffset")?.value ?? defaultTzOffset())
      });

      const previewChartBtn = document.getElementById("previewChartBtn");
      if (previewChartBtn) previewChartBtn.addEventListener("click", () => {
        const meta = readBirthMeta();
        if (!meta.birthDate || !meta.birthTime) {
          alert(T(BL("Bitte Geburtsdatum und -zeit eingeben.", "Please enter birth date and time.")));
          return;
        }
        if (!window.HDEngine?.hasEphemeris()) {
          alert(T(BL("Swiss Ephemeris nicht geladen.", "Swiss Ephemeris not loaded.")));
          return;
        }
        const result = calculateProfileChart(meta);
        const box = document.getElementById("chartPreviewBox");
        if (!result || result.error) {
          if (box) box.innerHTML = `<span style="color:var(--warn)">${T(chartErrorMessage(result) || BL("Berechnung fehlgeschlagen.", "Calculation failed."))}</span>`;
          return;
        }
        const payload = chartPayloadFromResult(result);
        if (box) {
          box.style.display = "block";
          const sunP = result.personality?.sun;
          const sunD = result.design?.sun;
          const sunDetail = sunP && sunD
            ? `<br><span style="color:var(--muted)">${T(BL("Sonne Persoenlichkeit", "Personality Sun"))}: G${sunP.gate}.${sunP.line} · ${T(BL("Sonne Design", "Design Sun"))}: G${sunD.gate}.${sunD.line} · ${T(BL("Sonnenbogen", "Solar arc"))}: ${(result.solarArcDegrees ?? ((sunP.longitude - sunD.longitude + 360) % 360)).toFixed(2)}° · Engine v${HDEngine.CHART_ENGINE_VERSION}</span>`
            : "";
          const phs = sunD?.color && sunD?.tone
            ? (() => {
                const isLeft = sunD.tone <= 3;
                const key = `${sunD.color}-${isLeft ? "L" : "R"}`;
                const d = PHS_DETERMINATIONS[key];
                return d ? `<br><span style="color:var(--good)">${T(BL("PHS Determination", "PHS determination"))}: ${T(d.title)}</span>` : "";
              })()
            : "";
          const gateSet = new Set(payload.definedGates);
          const nativeChannels = CHANNELS.filter(ch => gateSet.has(ch.a) && gateSet.has(ch.b)).map(ch => ch.key).join(", ");
          box.innerHTML = `<strong>${T(BL("Vorschau", "Preview"))}</strong><br>${T(payload.subtitle)}<br>${T(payload.authority)} · ${T(payload.strategy)}${sunDetail}${phs}<br><span style="color:var(--muted)">${payload.definedGates.length} ${T(BL("Tore", "gates"))}: ${payload.definedGates.join(", ")}</span><br><span style="color:var(--muted)">${T(BL("Definierte Zentren", "Defined centers"))}: ${payload.definedCenters.map(c => T(CENTER_LABELS[c])).join(" · ") || "—"}</span>${nativeChannels ? `<br><span style="color:var(--muted)">${T(BL("Aktive Kanaele", "Active channels"))}: ${nativeChannels}</span>` : ""}`;
        }
      });

      const profileForm = document.getElementById("profileForm");
      if (profileForm) profileForm.addEventListener("submit", e => {
        e.preventDefault();
        const meta = readBirthMeta();
        if (!meta.birthDate || !meta.birthTime) {
          alert(T(BL("Geburtsdatum und -zeit sind fuer die Berechnung erforderlich.", "Birth date and time are required for calculation.")));
          return;
        }
        const id = activeProfile;
        const name = document.getElementById("inputName").value.trim();
        const toneText = document.getElementById("inputTone").value.trim();
        const tone = BL(toneText, toneText);

        if (!window.HDEngine?.hasEphemeris()) {
          alert(T(BL("Swiss Ephemeris nicht geladen. Bitte Seite neu laden.", "Swiss Ephemeris not loaded. Please reload the page.")));
          return;
        }
        const result = calculateProfileChart(meta);
        if (!result || result.error) {
          alert(T(chartErrorMessage(result) || BL("Chart-Berechnung fehlgeschlagen.", "Chart calculation failed.")));
          return;
        }
        const chartPayload = chartPayloadFromResult(result);
        ProfileStore.savePerson(id, {
          birth: meta,
          chart: chartPayload,
          name,
          tone
        });
        activeTab = "daily";
        renderApp();
      });

      const resetProfileBtn = document.getElementById("resetProfileBtn");
      if (resetProfileBtn) resetProfileBtn.addEventListener("click", () => {
        ProfileStore.clearPerson(activeProfile, PROFILES);
        renderApp();
      });

      const newProfileBtn = document.getElementById("newProfileBtn");
      if (newProfileBtn) newProfileBtn.addEventListener("click", () => {
        const id = `custom-${Date.now()}`;
        const name = T(BL("Neues Profil", "New profile"));
        const tone = BL("", "");
        ProfileStore.addCustomPerson(id, name, tone);
        activeProfile = id;
        activeTab = "input";
        renderApp();
      });

      const deleteProfileBtn = document.getElementById("deleteProfileBtn");
      if (deleteProfileBtn) deleteProfileBtn.addEventListener("click", () => {
        if (PROFILES[activeProfile]) return;
        ProfileStore.clearPerson(activeProfile, PROFILES);
        activeProfile = "daniel";
        renderApp();
      });

      const clearTransitCacheBtn = document.getElementById("clearTransitCacheBtn");
      if (clearTransitCacheBtn) clearTransitCacheBtn.addEventListener("click", () => {
        localStorage.removeItem(STORAGE_KEYS.transits);
        renderApp();
      });
    }

    function showEphemerisLoading(detail) {
      const step = detail?.step ?? 0;
      const total = detail?.total ?? 3;
      const file = detail?.file ?? "wasm";
      const label = step === 0
        ? (lang === "de" ? "Starte Berechnungs-Engine…" : "Starting calculation engine…")
        : (lang === "de" ? `Lade Ephemeris (${step}/${total})…` : `Loading ephemeris (${step}/${total})…`);
      document.getElementById("app").innerHTML = `<section class="panel" style="margin:40px auto;max-width:520px;text-align:center"><h2>${lang === "de" ? "Lade Swiss Ephemeris…" : "Loading Swiss Ephemeris…"}</h2><p style="color:var(--muted);margin-top:12px">${label}</p><p style="color:var(--muted);font-size:.85rem;margin-top:8px">${file}</p></section>`;
    }

    function showEphemerisError(message) {
      const fileHint = location.protocol === "file:"
        ? (lang === "de"
          ? "Tipp: Nicht per Doppelklick öffnen. Stattdessen http://localhost:8765 nutzen (python -m http.server 8765 im Ordner trade-Strat-1)."
          : "Tip: Do not open via double-click. Use http://localhost:8765 instead (python -m http.server 8765 in trade-Strat-1).")
        : "";
      document.getElementById("app").innerHTML = `<section class="panel warning" style="margin:40px auto;max-width:560px;text-align:center"><h2>${lang === "de" ? "Ephemeris konnte nicht laden" : "Ephemeris failed to load"}</h2><p style="margin-top:12px">${message}</p>${fileHint ? `<p style="color:var(--muted);margin-top:12px;font-size:.9rem">${fileHint}</p>` : ""}<p style="color:var(--muted);margin-top:12px">${lang === "de" ? "Seite neu laden (Strg+F5)." : "Reload the page (Ctrl+F5)."}</p><button type="button" class="btn primary" style="margin-top:16px" onclick="location.reload()">${lang === "de" ? "Neu laden" : "Reload"}</button></section>`;
    }

    function boot() {
      if (!window.HDEngine?.hasEphemeris()) {
        showEphemerisLoading();
        return;
      }
      try {
        ProfileStore.migrateBirthOnly(PROFILES);
        renderApp();
      } catch (err) {
        const msg = err?.message || String(err);
        document.getElementById("app").innerHTML = `<section class="panel warning" style="margin:40px auto;max-width:560px"><h2>${lang === "de" ? "Fehler beim Laden" : "Load error"}</h2><p style="margin-top:12px">${msg}</p><p style="color:var(--muted);margin-top:12px">${lang === "de" ? "Seite neu laden oder Transit-Cache unter Eingabe leeren." : "Reload the page or clear the transit cache under Input."}</p></section>`;
        console.error(err);
      }
    }

    window.addEventListener("hd-ephemeris-progress", e => showEphemerisLoading(e.detail), { once: false });
    window.addEventListener("hd-ephemeris-error", e => showEphemerisError(e.detail?.error || "unknown"), { once: true });
    window.addEventListener("hd-ephemeris-ready", boot, { once: true });
    boot();
  </script>
</body>
</html>
